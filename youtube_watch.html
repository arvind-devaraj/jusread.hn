this video, we are going to implement the GPT2 model from scratch. We are only going to focus on the inference and not on the training logic. We will cover concepts like self attention, decoder blocks and generating new tokens.\n\n\nPaper: https://openai.com/blog/better-language-models/\nCode minGPT: https://github.com/karpathy/minGPT\nCode transformers: https://github.com/huggingface/transformers/blob/0f69b924fbda6a442d721b10ece38ccfc6b67275/src/transformers/models/gpt2/modeling_gpt2.py#L946\nCode from the video: https://github.com/jankrepl/mildlyoverfitted/tree/master/github_adventures/gpt\n\n00:"}, {"title": "State of GPT | BRK216HFS", "video_id": "bZQun8Y4L2A", "channel": "Microsoft Developer", "published_at": "2025-07-23T07:57:23Z", "topic": "LLM Alignment & RLHF (DPO)", "embeddable": true, "description": "Learn about the training pipeline of GPT assistants like ChatGPT, from tokenization to pretraining, supervised finetuning, and Reinforcement Learning from Human Feedback (RLHF). Dive deeper into practical techniques and mental models for the effective use of these models, including prompting strategies, finetuning, the rapidly growing ecosystem of tools, and their future extensions.\n\n*Speakers:*\n * Andrej Karpathy\n\n\n*Session Information:*\nThis video is one of many sessions delivered for the Microsoft Build 2023 event. View the full session schedule and learn more about Microsoft Build at https"}, {"title": "How Decoder-Only Transformers (like GPT) Work", "video_id": "baykhvFS_e4", "channel": "Super Data Science: ML & AI Podcast with Jon Krohn", "published_at": "2024-03-29T19:54:45Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "Learn about encoders, cross attention and masking for LLMs as SuperDataScience Founder Kirill Eremenko returns to the SuperDataScience podcast, to speak with @JonKrohnLearns about transformer architectures and why they are a new frontier for generative AI. If you’re interested in applying LLMs to your business portfolio, you’ll want to pay close attention to this episode!\n\nYou can watch the full interview, “759: Full Encoder-Decoder Transformers Fully Explained — with Kirill Eremenko” here: https://www.superdatascience.com/759"}, {"title": "Bilinear form Chapter 1", "video_id": "5fA4xYPV3nc", "channel": "imatics", "published_at": "2024-03-29T19:53:31Z", "topic": "Linear Algebra for ML", "embeddable": true, "description": "*sorry  i forgot to mention the negative signe when computing the dot product of two vectors facing opposite direction.\nI edit this video while studying  manim engine plus i animate with the mouse so it took me a long time and due to the limited time for SoME1 i had to reduce the number of clips that goes into this video so this will be just introduction to bilinear form.\n\nEssence of linear algebra by 3Blue1Brown: \nhttps://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab"}, {"title": "Decoder-Only Transformers, ChatGPTs specific Transformer, Clearly Explained!!!", "video_id": "bQ5BoolX9Ag", "channel": "StatQuest with Josh Starmer", "published_at": "2024-03-29T17:59:24Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "Transformers are taking over AI right now, and quite possibly their most famous use is in ChatGPT. ChatGPT uses a specific type of Transformer called a Decoder-Only Transformer, and this StatQuest shows you how they work, one step at a time. And at the end (at 32:14), we talk about the differences between a Normal Transformer and a Decoder-Only Transformer. BAM!\n\nNOTE: If you're interested in learning more about Backpropagation, check out these 'Quests:\nThe Chain Rule: https://youtu.be/wl1myxrtQHQ\nGradient Descent: https://youtu.be/sDv4f4s2SB8\nBackpropagation Main Ideas: https://youtu.be/IN2Xm"}, {"title": "CS480/680 Lecture 19: Attention and Transformer Networks", "video_id": "OyFJWRnt_AY", "channel": "Pascal Poupart", "published_at": "2024-03-28T13:24:27Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": ""}, {"title": "How Google Translate Works - The Machine Learning Algorithm Explained!", "video_id": "AIpXjFwVdIE", "channel": "CS Dojo Community", "published_at": "2024-03-28T07:33:02Z", "topic": "Neural Network Foundations", "embeddable": true, "description": "Let’s take a look at how Google Translate’s Neural Network works behind the scenes! Read these references below for the best understanding of Neural Machine Translation! \n\nSUBSCRIBE TO CODE EMPORIUM: https://www.youtube.com/c/CodeEmporium?sub_confirmation=1\n\nTo submit your video to CS Dojo Community, please use this link: https://csdojo.io/enter\n\nREFERENCES\n\n[1] Landmark paper of LSTM (Hochreiter et al., 1997): https://www.bioinf.jku.at/publication... \n[2] Landmark paper of Neural Machine Translation NMT (Kalchbrenner et al., 2013): https://arxiv.org/abs/1306.3584 \n[3] Learning Phrase Represen"}, {"title": "Retrieval Augmented Generation (RAG) Explained: Embedding, Sentence BERT, Vector Database (HNSW)", "video_id": "rhZgXNdhWDY", "channel": "Umar Jamil", "published_at": "2024-03-16T09:06:34Z", "topic": "Retrieval-Augmented Generation (RAG) & Vector Search", "embeddable": true, "description": "Get your 5$ coupon for Gradient:  https://gradient.1stcollab.com/umarjamilai\n\nIn this video we explore the entire Retrieval Augmented Generation pipeline. I will start by reviewing language models, their training and inference, and then explore the main ingredient of a RAG pipeline: embedding vectors. We will see what are embedding vectors, how they are computed, and how we can compute embedding vectors for sentences. We will also explore what is a vector database, while also exploring the popular HNSW (Hierarchical Navigable Small Worlds) algorithm used by vector databases to find embedding v"}, {"title": "How GPT/ChatGPT Work - An Understandable Introduction to the Technology - Professor Harry Surden", "video_id": "IMAhwv5dn8E", "channel": "Harry Surden", "published_at": "2024-03-10T08:23:10Z", "topic": "LLM Alignment & RLHF (DPO)", "embeddable": true, "description": "Professor Harry Surden gives a primer to law students about how GPT technology works, at an intuitive and understandable level, for those without a technical background.\n\nThis student tutorial was part of a larger conference on Generative Artificial Intelligence and Law at the University of Colorado Law School Silicon Flatirons Center, in April 2023.   \n\nhttps://siliconflatirons.org/events/exploring-generative-ai-and-law/\n\nHarry Surden is a law professor at the University of Colorado, and Associate Director of Stanford University's Center for Legal Informatics (CodeX), who researches artificia"}, {"title": "Paper Discussion: Attention is all you need", "video_id": "88bS806ZAdU", "channel": "Hasgeek TV", "published_at": "2024-03-07T19:26:32Z", "topic": "Research & Literature Review", "embeddable": true, "description": "In the rapidly evolving field of natural language processing, the “Attention Is All You Need” paper, authored by Vaswani et al. in 2017, marks a significant pivot point. Prior to this work, sequence-to-sequence models, especially those relying on recurrent neural networks (RNNs) and long short-term memory (LSTM) units, dominated the landscape. However, these architectures process data sequentially, leading to potential bottlenecks in training and limitations in handling long-range dependencies in sequences.\n\nThe paper introduces the Transformer architecture, a novel approach that does away wit"}, {"title": "Transformers, explained: Understand the model behind ChatGPT", "video_id": "Pnd8bCJ4Z3A", "channel": "Leon Petrou", "published_at": "2024-03-07T18:12:40Z", "topic": "LLM Alignment & RLHF (DPO)", "embeddable": true, "description": "🚀 Learn AI Prompt Engineering: https://bit.ly/3v8O4Vt\n\nIn this technical overview, we dissect the architecture of Generative Pre-trained Transformer (GPT) models, drawing parallels between artificial neural networks and the human brain.\n\nFrom the foundational GPT-1 to the advanced GPT-4, we explore the evolution of GPT models, focusing on their learning processes, the significance of data in training, and the revolutionary Transformer architecture. \n\nThis video is designed for curious non-technical people looking to understand the complexities of GPT models in a way that's easy to understand.\n"}, {"title": "Create a Large Language Model from Scratch with Python – Tutorial", "video_id": "UU1WVnMk4E8", "channel": "freeCodeCamp.org", "published_at": "2025-04-15T17:59:33Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "Learn how to build your own large language model, from scratch. This course goes into the data handling, math, and transformers behind large language models. You will use Python.\n\n✏️ Course developed by @elliotarledge \n\n💻 Code and course resources: https://github.com/Infatoshi/fcc-intro-to-llms\n\nJoin Elliot's Discord server: https://discord.gg/pV7ByF9VNm\nElliot on X: https://twitter.com/elliotarledge\n\n❤️ Try interactive Python courses we love, right in your browser: https://scrimba.com/freeCodeCamp-Python (Made possible by a grant from our friends at Scrimba)\n\n⭐️ Contents ⭐️\n(0:00:00) Intro\n(0"}, {"title": "Building a ML Transformer in a Spreadsheet", "video_id": "S9eKuRVigjY", "channel": "Concepts Illuminated", "published_at": "2024-03-04T16:46:23Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "We continue the theme of building neural networks in a spreadsheet, as a way to do a worked example of them.\nIn this video, we build a Transformer (a type of Machine Learning model) which can encipher text using the Atbash cipher and reverse strings. It also introduces the topics of self-attention and positional encoding.\n\nFollow along by making a copy of https://bit.ly/TransformerSheet1\n\nThree press releases about breakthroughs with Transformer models:\n - https://deepmind.com/blog/article/Competitive-programming-with-AlphaCode\n - https://ai.googleblog.com/2022/01/lamda-towards-safe-grounded-a"}, {"title": "Transformer (Attention is all you need)", "video_id": "z1xs9jdZnuY", "channel": "Minsuk Heo 허민석", "published_at": "2024-03-04T16:44:27Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "understanding Transformer with its key concepts (attention, multi head attention, positional encoding, residual connection label smoothing) with example.\n\nall machine learning youtube videos from me,\nhttps://www.youtube.com/playlist?list=PLVNY1HnUlO26x597OgAN8TCgGTiE-38D6"}, {"title": "A gentle visual intro to Transformer models", "video_id": "VzvG23gmcYU", "channel": "Hugging Face", "published_at": "2024-03-28T07:46:16Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "Jay explains to us how Transformer models work, diving into key concepts like encoder, decoder or attention.\n\nJay Alammar, Cohere. Through his popular ML blog, Jay has helped millions of researchers and engineers visually understand machine learning tools and concepts from the basic (ending up in numPy, pandas docs) to the cutting-edge (Transformers, BERT, GPT-3)."}, {"title": "Attention is all you need. A Transformer Tutorial: 7. Decoder Masked Multihead Attention", "video_id": "SyWMFPFvsd0", "channel": "feather", "published_at": "2024-03-04T16:25:28Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "Repo link: https://github.com/feather-ai/transformers-tutorial\n\nIn the last Transformer tutorial lesson, we finished up building the encoder stack. Now it's time for the decoder. In this lesson, we introduce the decoder and masking, and build out the masked multihead attention component of the decoder."}, {"title": "Transformers - Part 1 - Self-attention: an introduction", "video_id": "0SmNEp4zTpc", "channel": "Lennart Svensson", "published_at": "2024-03-04T10:10:48Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "In this video, we briefly introduce transformers and provide an introduction to the intuition behind self-attention.\n\nThe video is part of a series of videos on the transformer architecture, https://arxiv.org/abs/1706.03762. You can find the complete series and a longer motivation here: \nhttps://www.youtube.com/playlist?list=PLDw5cZwIToCvXLVY2bSqt7F2gu8y-Rqje\n\nSlides are available here: https://drive.google.com/file/d/1uCAwfYsRE8jnhozYDP2di8nYRMt77yor/view?usp=sharing"}, {"title": "Transformer Architecture Explained | Attention Is All You Need | Foundation of BERT, GPT-3, RoBERTa", "video_id": "ELTGIye424E", "channel": "Deep Learning Explainer", "published_at": "2024-03-04T10:09:25Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "This video explains the Transformer architecture in a very detailed way, including most math formulas in the paper, and the neural network operations behind it. The Transformer is the foundation of many powerful language models like BERT, GPT3, RoBERTa, XLNET, ELECTRA, T5. Understanding how it works in detail might help you modify, optimize, or improve it in the way you want.  \n\n\nConnect\nLinkedin  https://www.linkedin.com/in/xue-yong-fu-955723a6/\nTwitter   https://twitter.com/home\nEmail     edwindeeplearning@gmail.com\n\n0:00 - Intro \n1:10 - Architecture overview\n1:56 - Encoder \n3:58 - Residual "}, {"title": "Transformers for beginners | What are they and how do they work", "video_id": "nTlLAS7N7qE", "channel": "Code With Aarohi", "published_at": "2024-03-04T10:04:26Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "Over the past five years, **Transformers** have revolutionized **natural language processing (NLP)** and are the backbone of models like **GPT, BERT, and T5**.  \n\nIn this video, we explain how Transformers work, step by step, in an easy-to-understand way:  \n\n📌 **Topics Covered:**  \n✅ How the **encoder** converts input sentences into vectors  \n✅ How the **decoder** generates translated or predicted text  \n✅ The **self-attention mechanism** and why it’s crucial  \n✅ **Positional encoding** to understand word order  \n✅ How Transformers process entire sentences simultaneously for better context  \n✅"}, {"title": "Transformer Embeddings - EXPLAINED!", "video_id": "l4is4uHvKlU", "channel": "CodeEmporium", "published_at": "2024-03-04T09:45:44Z", "topic": "Word Embeddings & Language Representations", "embeddable": true, "description": "Follow me on M E D I U M: https://towardsdatascience.com/likelihood-probability-and-the-math-you-should-know-9bf66db5241b\n\nSTRATASCRATCH\nFor Thousands of Data Science Interview Questions + Solutions, sign up for stratascratch: https://www.stratascratch.com/?via=CodeEmporium\n\n\nREFERENCES\n[1] Why it's okay to add position embeddings: https://randorithms.com/2020/11/17/Adding-Embeddings.html\n[2] Main Transformer Paper: https://arxiv.org/abs/1706.03762\n[3] Word2Vec Vs Transformers: https://www.quora.com/What-are-the-main-differences-between-the-word-embeddings-of-ELMo-BERT-Word2vec-and-GloVe\n[4] U"}, {"title": "Introduction to Language Models (LLM's, Prompt Engineering, Encoder/Decoder and more)", "video_id": "9PGmMdkTZls", "channel": "Neuro Symbolic", "published_at": "2024-03-04T06:31:44Z", "topic": "Neural Language Models (NLMs)", "embeddable": true, "description": "Introduction to language models.  Covers a set of topics to get you started including generative AI (decoders), LLMs (e.g., GPT), encoders (e.g., BERT), prompt engineering, fine tuning, self-supervised learning, transformer architecture, attention, and embeddings.\n\n00:00 Introduction\n01:58 Embeddings\n05:02 Transformer architecture\n12:01 Encoders (BERT)\n19:47 Generative AI (decoders/LLM/GPT)\n28:26 Basic Prompt Engineering \n34:24 Advanced Prompt Engineering\n48:32 LLM Limitations and Hallucinations\n\nAbout the channel:\nThe Neuro Symbolic Channel provides the tutorials, courses, and research result"}, {"title": "The Attention Mechanism in GPTs", "video_id": "bcOA9rD55t8", "channel": "AI Makerspace", "published_at": "2024-03-03T20:40:49Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "GPT-4 Summary: Unlock the secrets of the transformative attention mechanism powering today’s AI in our deep-dive event, designed for both aspiring AI engineers and leaders! Seven years since the landmark \"Attention is All You Need\" paper, the intricacies of attention in GPT-style transformers remain a mystery to many. This session promises to demystify the process from text tokenization to the magic of next-word prediction, exploring the nuts and bolts of Self-Attention, Scaled Dot Product attention, and the vital auto-regressive mechanisms at play. We'll dissect the architecture of multiple a"}, {"title": "Recent advances in NLP By Manu Chandra Chief Data Scientist & Co-founder at FN MathLogic", "video_id": "1qHR9G8ojQg", "channel": "AIM Network", "published_at": "2024-03-28T07:57:19Z", "topic": "AI Product Strategy", "embeddable": true, "description": "Manu will talk about his experiences with using some of the recent advances in text analytics/ NLP/ NMT including BERT, GPT2 and XLNet"}, {"title": "LLaMA: Open and Efficient Foundation Language", "video_id": "A6h7shg8rEw", "channel": "YanAITalk", "published_at": "2024-03-03T10:54:35Z", "topic": "Research & Literature Review", "embeddable": true, "description": "LLM reading group on the LLaMA paper of Open and Efficient Foundation Language: https://arxiv.org/abs/2302.13971"}, {"title": "Lecture 7: Convolutional Networks", "video_id": "ANyxBVxmdZ0", "channel": "Michigan Online", "published_at": "2024-03-03T10:51:12Z", "topic": "Convolutional Neural Networks (CNNs)", "embeddable": true, "description": "Lecture 7 moves from fully-connected to convolutional networks by introducing new computational primitives that respect the spatial structure of 2D image data. We discuss convolution layers, which slide a learnable filter over the input data. We discuss pooling layers, which spatially downsample their input data. We then look at normalization layers including batch, layer, and instance normalization, which normalize their input data along different axes and improve training speed.\n\nSlides: http://myumi.ch/K43Zy\n___________________________________________________________________________________"}, {"title": "Adding vs. concatenating positional embeddings & Learned positional encodings", "video_id": "M2ToEXF6Olw", "channel": "AI Coffee Break with Letitia", "published_at": "2024-03-03T09:34:18Z", "topic": "Word Embeddings & Language Representations", "embeddable": true, "description": "When to add and when to concatenate positional embeddings? What are arguments for learning positional encodings? When to hand-craft them? Ms. Coffee Bean’s answers these questions in this video.\n➡️ AI Coffee Break Merch! 🛍️ https://aicoffeebreak.creator-spring.com/\n\nOutline:\n00:00 Concatenated vs. added positional embeddings\n04:49 Learned positional embeddings\n06:48 Ms. Coffee Bean deepest insight ever\n\n▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀\n🔥 Optionally, help us boost our Coffee Bean production!  ☕\nPatreon: https://www.patreon.com/AICoffeeBreak\nKo-fi: https://ko-fi.com/aicoffeebreak\n▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀"}, {"title": "Deep Learning for Natural Language Processing (Richard Socher, Salesforce)", "video_id": "oGk1v1jQITw", "channel": "Lex Fridman", "published_at": "2024-03-30T06:31:03Z", "topic": "LLM Reasoning & Test-Time Compute", "embeddable": true, "description": "The talks at the Deep Learning School on September 24/25, 2016 were amazing. I clipped out individual talks  from the full live streams and provided links to each below in case that's useful for people who want to watch specific talks several times (like I do). Please check out the official website (http://www.bayareadlschool.org) and full live streams below.\n\nHaving read, watched, and presented deep learning material over the past few years, I have to say that this is one of the best collection of introductory deep learning talks I've yet encountered. Here are links to the individual talks an"}, {"title": "torch.nn.Embedding explained (+ Character-level language model)", "video_id": "euwN5DHfLEo", "channel": "mildlyoverfitted", "published_at": "2025-05-15T19:21:44Z", "topic": "Word Embeddings & Language Representations", "embeddable": true, "description": "In this video, I will talk about the Embedding module of PyTorch. It has a lot of applications in the Natural language processing field and also when working with categorical variables. I will explain some of its functionalities like the padding index and maximum norm. In the second part of this video I will use the Embedding module to represent characters in an English alphabet and build a text generating model. Once we train the model, we we look into how the character embeddings evolved over epochs.\n\nCode: https://github.com/jankrepl/mildlyoverfitted/tree/master/mini_tutorials/embedding\n\n00"}, {"title": "Create ChatGPT From Scratch in 40 Minute", "video_id": "l-CjXFmcVzY", "channel": "Brainxyz", "published_at": "2025-05-26T10:24:05Z", "topic": "Deep Learning Frameworks (PyTorch/TensorFlow)", "embeddable": true, "description": "Source Code: https://github.com/hunar4321/reweight-gpt\nTitle: Fast Paced, Programing Tutorial on Deep Neural Networks From the Basics To GPT and Beyond\n\nTopics:\n00:00 Machine Learning\n05:12 Evolutionary Algorithms\n08:59 Gradient Descent\n11:38 Neural Networks\n13:12 Deep Learning\n17:16 PyTorch\n23:56 Language Modelling\n29:51 Convolutional Neural Networks\n36:28 LSTM - Attention - Transformer\n41:35 Re-weight GPT\n44:59 A.I. alignment \n\nWebsite: https://www.brainxyz.com/\n#pytorch #python #chatgpt #deeplearning\nDisclaimer:  All materials in this video are used for educational purposes and fall within "}, {"title": "Lecture 2 | Word Vector Representations: word2vec", "video_id": "ERibwqs9p38", "channel": "Stanford University School of Engineering", "published_at": "2024-03-02T21:23:26Z", "topic": "Word Embeddings & Language Representations", "embeddable": true, "description": "Lecture 2 continues the discussion on the concept of representing words as numeric vectors and popular approaches to designing word vectors. \n\nKey phrases: Natural Language Processing. Word Vectors. Singular Value Decomposition. Skip-gram. Continuous Bag of Words (CBOW). Negative Sampling. Hierarchical Softmax. Word2Vec.\n\n-------------------------------------------------------------------------------\n\nNatural Language Processing with Deep Learning\n\nInstructors:\n- Chris Manning\n- Richard Socher\n\nNatural language processing (NLP) deals with the key artificial intelligence technology of understan"}, {"title": "Attention Is All You Need", "video_id": "iDulhoQ2pro", "channel": "Yannic Kilcher", "published_at": "2024-03-02T09:35:10Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "https://arxiv.org/abs/1706.03762\n\nAbstract:\nThe dominant sequence transduction models are based on complex recurrent or convolutional neural networks in an encoder-decoder configuration. The best performing models also connect the encoder and decoder through an attention mechanism. We propose a new simple network architecture, the Transformer, based solely on attention mechanisms, dispensing with recurrence and convolutions entirely. Experiments on two machine translation tasks show these models to be superior in quality while being more parallelizable and requiring significantly less time to "}, {"title": "Attention is all you need; Attentional Neural Network Models | Łukasz Kaiser | Masterclass", "video_id": "rBCqOTEfxvg", "channel": "Pi School", "published_at": "2025-06-03T05:49:33Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "In his talk, Lukasz Kaiser — a research scientist at Google Brain at the time and now at OpenAI — discusses attentional neural network models and the rapid developments that have recently been made in this field. In his talk, he explains how such models 'look at the past and generate the next word in the output' and how they are trained. In a new talk, Lukasz introduces an efficient new variant of the Transformer. \n\nEnjoy the video: https://pischool.link/transformer-update"}, {"title": "How a Transformer works at inference vs training time", "video_id": "IGu7ivuy1Ag", "channel": "Niels Rogge", "published_at": "2024-03-28T07:57:45Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "I made this video to illustrate the difference between how a Transformer is used at inference time (i.e. when generating text) vs. how a Transformer is trained.\n\nDisclaimer: this video assumes that you are familiar with the basics of deep learning, and that you've used HuggingFace Transformers at least once. If that's not the case, I highly recommend this course: http://cs231n.stanford.edu/ which will teach you the basics of deep learning. To learn HuggingFace, I recommend our free course: https://huggingface.co/course.\n\nThe video goes in detail explaining the difference between input_ids, dec"}, {"title": "Coding a Transformer from scratch on PyTorch, with full explanation, training and inference.", "video_id": "ISNdQcPhsts", "channel": "Umar Jamil", "published_at": "2024-03-28T07:58:12Z", "topic": "Deep Learning Frameworks (PyTorch/TensorFlow)", "embeddable": true, "description": "In this video I teach how to code a Transformer model from scratch using PyTorch. I highly recommend watching my previous video to understand the underlying concepts, but I will also rehearse them in this video again while coding. All of the code is mine, except for the attention visualization function to plot the chart, which I have found online at the Harvard university's website.\n\nPaper: Attention is all you need - https://arxiv.org/abs/1706.03762\n\nThe full code is available on GitHub: https://github.com/hkproj/pytorch-transformer \nIt also includes a Colab Notebook so you can train the mode"}, {"title": "What are Transformer Models and how do they work?", "video_id": "qaWMOYf4ri8", "channel": "Luis Serrano Academy", "published_at": "2024-03-28T07:59:05Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "Check out the latest (and most visual) video on this topic! The Celestial Mechanics of Attention Mechanisms: https://www.youtube.com/watch?v=RFdb2rKAqFw\n\nThis is the last of a series of 3 videos where we demystify Transformer models and explain them with visuals and friendly examples.\n\nVideo 1: The attention mechanism in high level https://www.youtube.com/watch?v=OxCpWwDCDFQ\n\nVideo 2: The attention mechanism with math https://www.youtube.com/watch?v=UPtG_38Oq8o\n\nVideo 3 (This one): Transformer models\n\nIf you like this material, check out LLM University from Cohere!\nhttps://llm.university\n\nGet "}, {"title": "ChatGPT Position and Positional embeddings: Transformers & NLP 3", "video_id": "DINUVMojNwU", "channel": "Lucidate", "published_at": "2024-02-29T20:02:11Z", "topic": "Word Embeddings & Language Representations", "embeddable": true, "description": "In natural language processing, understanding the order of words in a sentence is crucial for comprehending its meaning. This is where positional embeddings come in. Positional embeddings allow transformer models to understand the relative and absolute position of each word in a sentence, which improves the overall understanding and representation of the sentence.\n\nIn this video we look at several examples to demonstrate the importance of encoding position. One key example consists of different sentences with the same words, but with the word ‘only’ in different positions. The changed position"}, {"title": "CS 182: Lecture 12: Part 2: Transformers", "video_id": "4AzsiCMw_-s", "channel": "RAIL", "published_at": "2024-02-29T19:46:39Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": ""}, {"title": "Cross Attention | Method Explanation | Math Explained", "video_id": "aw3H-wPuRcw", "channel": "Outlier", "published_at": "2024-02-29T19:45:07Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "Cross Attention is one of the most crucial methods in the current field of deep learning. It enables many many models to work the way they are and output amazing results as seen with #stablediffusion #imagen #muse etc.\nIn this video I'm giving a visual and (hopefully) intuitive explanation of how Cross Attention works. I'm trying to give some simple examples to have an easy way to understand the math. \n\n00:00 Introduction\n01:10 Self Attention explained\n07:40 Cross Attention explained\n11:28 Summary\n12:25 Outro\n\n#crossattention #attention"}, {"title": "Transformer Neural Networks Derived from Scratch", "video_id": "kWLed8o5M2Y", "channel": "Algorithmic Simplicity", "published_at": "2024-02-29T19:01:51Z", "topic": "Deep Learning Frameworks (PyTorch/TensorFlow)", "embeddable": true, "description": "#transformers #chatgpt  #SoME3 #deeplearning\n\nJoin me on a deep dive to understand the most successful neural network ever invented: the transformer. Transformers, originally invented for natural language translation, are now everywhere. They have fast taken over the world of machine learning (and the world more generally) and are now used for almost every application, not the least of which is ChatGPT. \n\nIn this video I take a more constructive approach to explaining the transformer: starting from a simple convolutional neural network, I will step through all of the changes that need to be ma"}, {"title": "Attention is all you need (Transformer) - Model explanation "2023-01-27T04:29:42Z", "topic": "Neural Network Foundations", "embeddable": true, "description": "Transformers are the rage nowadays, but how do they work? This video demystifies the novel neural network architecture with step by step explanation and illustrations on how transformers work.\n\nCORRECTIONS:\nThe sine and cosine functions are actually applied to the embedding dimensions and time steps! \n\n⭐ Play and Experiment With the Latest AI Technologies at https://grandline.ai ⭐\n\n\nHugging Face Write with Transformers\nhttps://transformer.huggingface.co/"}, {"title": "Transformers for beginners | What are they and how do they work", "video_id": "_UVfwBqcnbM", "channel": "AssemblyAI", "published_at": "2023-01-27T04:29:18Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "This week we’re looking into transformers. Transformers were introduced a couple of years ago with the paper Attention is All You Need by Google Researchers. Since its introduction transformers has been widely adopted in the industry.\n\nGet your Free Token for AssemblyAI Speech-To-Text API 👇\nhttps://www.assemblyai.com/?utm_source=youtube&utm_medium=referral&utm_campaign=yt_mis_8&utm_id=yt_mis_8\n\nModels like BERT, GPT-3 made groundbreaking improvements in the world of NLP using transformers. Since then model libraries like hugging face made it possible for everyone to use transformer based model"}, {"title": "Stanford CS224N: NLP with Deep Learning | Winter 2019 | Lecture 14 – Transformers and Self-Attention", "video_id": "5vcj8kSwBCY", "channel": "Stanford Online", "published_at": "2025-05-23T00:34:46Z", "topic": "Transformers & Attention Mechanisms", "embeddable": false, "description": "For more information about Stanford’s Artificial Intelligence professional and graduate programs, visit: https://stanford.io/3niIw41\n\nProfessor Christopher Manning, Stanford University, Ashish Vaswani & Anna Huang, Google\nhttp://onlinehub.stanford.edu/ \n\nProfessor Christopher Manning\nThomas M. Siebel Professor in Machine Learning, Professor of Linguistics and of Computer Science\nDirector, Stanford Artificial Intelligence Laboratory (SAIL)\n \nTo follow along with the course schedule and syllabus, visit: http://web.stanford.edu/class/cs224n/index.html#schedule\n\n0:00 Introduction\n2:07 Learning Rep"}, {"title": "Transformers, explained: Understand the model behind GPT, BERT, and T5", "video_id": "SZorAJ4I-sA", "channel": "Google Cloud Tech", "published_at": "2024-04-10T11:38:06Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "Dale’s Blog → https://goo.gle/3xOeWoK\nClassify text with BERT → https://goo.gle/3AUB431\n\nOver the past five years, Transformers, a neural network architecture, have completely transformed state-of-the-art natural language processing. Want to translate text with machine learning? Curious how an ML model could write a poem or an op ed? Transformers can do it all. In this episode of Making with ML, Dale Markowitz explains what transformers are, how they work, and why they’re so impactful. Watch to learn how you can start using transformers in your app!\n\nChapters: \n0:00 - Intro\n0:51 - What are tra"}, {"title": "ChatGPT - Semantics: Transformers & NLP 2", "video_id": "6XLJ7TZXSPg", "channel": "Lucidate", "published_at": "2023-01-27T02:42:43Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "How do transformers like ChatGPT learn and represent words?\n\nTransformers are a type of neural network architecture that are used in natural language processing tasks like language translation, language modelling, and text classification. They are effective at converting words into numerical values, which is necessary for AI to understand language. There are three key concepts to consider when encoding words numerically: semantics (meaning), position (relative and absolute), and relationships and attention (grammar). Transformers excel at capturing relationships and attention, or the way words"}, {"title": "ChatGPT GPT-4 | Learn About it", "video_id": "iE7cvm4QbWw", "channel": "Beyond TodAI", "published_at": "2023-01-26T17:58:42Z", "topic": "LLM Alignment & RLHF (DPO)", "embeddable": true, "description": "Hello Beyonders!\nWe discuss ChatGPT from a different perspective. We start from the humble beginnings of the chatbot to where it is now, and where it will go. Rumours of GPT-4 are a mix of legendary, unbelievable and skepticism. GPT-4 will definitely take things to the next level from what we’re hearing. OpenAI continues to impress with their language models. We also talk about Google & how they’re part of this story. By the end of this video you will be ready to take on GPT-4 when it comes. Enjoy!\nTopic: Artificial Intelligence\n\n\nChapters\n00:00 Introduction\n00:59 GPT\n01:32 GPT-2\n03:40 GPT-3\n0"}, {"title": "BERT Paper Explained", "video_id": "yCj8jHnm5OQ", "channel": "Aladdin Persson", "published_at": "2023-01-23T11:05:31Z", "topic": "Research & Literature Review", "embeddable": true, "description": "❤️ Support the channel ❤️\nhttps://www.youtube.com/channel/UCkzW5JSFwvKRjXABI-UTAkQ/join\n\nPaper: https://arxiv.org/abs/1810.04805\n\nUseful resources to learn about transformers:\nhttps://peterbloem.nl/blog/transformers\nhttps://nlp.seas.harvard.edu/2018/04/03/attention.html\nhttps://jalammar.github.io/illustrated-transformer/\n\nUseful resources to learn about BERT:\nhttps://jalammar.github.io/illustrated-bert/\n\nPaid Courses I recommend for learning (affiliate links, no extra cost for you):\n⭐  Machine Learning Specialization https://bit.ly/3hjTBBt\n⭐ Deep Learning Specialization https://bit.ly/3YcUkoI\n"}, {"title": "Visual Guide to Transformer Neural Networks - (Episode 2) Multi-Head & Self-Attention", "video_id": "mMa2PmYJlCo", "channel": "Hedu AI by Batool Haider", "published_at": "2023-01-23T09:07:50Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "Visual Guide to Transformer Neural Networks (Series) - Step by Step Intuitive Explanation\n\nEpisode 0 -  [OPTIONAL] The Neuroscience of \"Attention\"\nhttps://youtu.be/48gBPL7aHJY\n\nEpisode 1 -  Position Embeddings\nhttps://www.youtube.com/watch?v=dichIcUZfOw\n\nEpisode 2 -  Multi-Head & Self-Attention\nhttps://www.youtube.com/watch?v=mMa2PmYJlCo&t=14s\n\nEpisode 3 -  Decoder’s Masked Attention\nhttps://www.youtube.com/watch?v=gJ9kaJsE78k&t=172s\n\nThis video series explains the math, as well as the intuition behind the Transformer Neural Networks that were first introduced by the “Attention is All You Need"}, {"title": "Transformer - Attention Is All You Need | PyTorch Implementation", "video_id": "VGO9O3JgS3c", "channel": "Maciej Balawejder", "published_at": "2023-01-23T09:06:16Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "In this video I implement in PyTorch the popular Transformer architecture.\n\nPaper:\nhttps://arxiv.org/abs/1706.03762\n\n▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬\n\nConnect with me on:\n\nLinkedin - https://www.linkedin.com/in/maciej-balawejder-rt8015/\n\nGitHub - https://github.com/maciejbalawejder\n\nMedium - https://medium.com/@maciejbalawejder\n\nBuy Me a Coffee - [https://www.buymeacoffee.com/mbalawejder](https://www.buymeacoffee.com/mbalawejder)\n\n▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬\n0:00 General Overview\n3:30 Positional Encoding\n6:20 Self Attention\n11:50 Feed Forward\n13:18 Encoder Layer\n14:30 Decoder Layer\n16:00 Encoder Decoder "}, {"title": "The Transformer neural network architecture EXPLAINED. “Attention is all you need”", "video_id": "FWFA4DGuzSc", "channel": "AI Coffee Break with Letitia", "published_at": "2023-01-23T07:28:10Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "⚙️ It is time to explain how Transformers work. If you are looking for a simple explanation, you found the right video! 🛑🪧Our remastered version of this video: https://youtu.be/ec9IQMiJBhs 🪧\nHere we learn how large language models such as ChatGPT, Bard, Claude, GPT4 work. Vision Transformers work with the same principles, but we have a dedicated ViT video here: https://youtu.be/DVoHvmww2lQ\n\nCheck this out for a super cool transformer visualisation! 👏 https://poloclub.github.io/transformer-explainer/\n\n➡️ AI Coffee Break Merch! 🛍️ https://aicoffeebreak.creator-spring.com/\n\n🔗 Table of contents wi"}, {"title": "Using cuDNN with Neural Networks and GPUs", "video_id": "CVwctY8nqhQ", "channel": "Shamli Singh", "published_at": "2026-02-11T08:26:14Z", "topic": "Convolutional Neural Networks (CNNs)", "embeddable": true, "description": "This video was made for the class CS 259 at San Jose State University. You can find the code shown at the end of the video at this link: https://github.com/botdotcom/MNISTforGPU\n\nMy blog post on how to install CUDA and cuDNN on Windows 10 is out at https://medium.com/@botdotcom/installing-cudnn-for-gpu-support-with-tensorflow-on-windows-10-aff10c6c9929"}, {"title": "Kullback Leibler (KL) Divergence for Machine Learning | Relation to Cross Entropy | Explained", "video_id": "rE4PbltQwxo", "channel": "RoboSathi", "published_at": "2026-02-09T05:38:19Z", "topic": "Loss Functions & Information Theory (Entropy, KL Divergence)", "embeddable": true, "description": "📘 Notes: https://robosathi.com/docs/maths/probability/cross-entropy-kl-divergence/\n🎥 NLP Course: https://www.youtube.com/playlist?list=PLnpa6KP2ZQxcDlHCeNiKbRhLWKVunQaxn\n🎥 Deep Learning Course: https://www.youtube.com/playlist?list=PLnpa6KP2ZQxe749nPGDV2cd6SR6zIZIJl\n🎥 Machine Learning Course: https://www.youtube.com/playlist?list=PLnpa6KP2ZQxeydAqz2lsSMFYinbrJy9mu\n🎥 Full Maths Course: https://www.youtube.com/playlist?list=PLnpa6KP2ZQxen-R6NytSMigAri7piPhFp\n\nIn this video, we’ll break down Kullback–Leibler (KL) Divergence, a key concept in Machine Learning and Information Theory.\n\nLearning Obje"}, {"title": "8b. Loss Functions | Cross-Entropy, KL Divergence,  in  under 2 hours", "video_id": "kTeBcaffvN8", "channel": "Musavir Khaliq", "published_at": "2026-02-09T05:26:28Z", "topic": "Loss Functions & Information Theory (Entropy, KL Divergence)", "embeddable": true, "description": "Unlock the secrets of core machine learning and deep learning concepts with this comprehensive lecture on Loss Functions. This session focuses on the two most crucial and often confused loss functions: Cross-Entropy and Kullback-Leibler (KL) Divergence\n\nWe'll start with the fundamentals:\n\nWhat is a Loss Function and why is it the engine that drives model training?\n\nThe essential distinction between cost and loss functions.\n\nIn-depth explanation and mathematical derivation of Cross-Entropy Loss , covering its applications for both binary classification (Binary Cross-Entropy) and multi-class cla"}, {"title": "Mathematics behind Shannon Entropy, Cross-Entropy and KL Divergence", "video_id": "xqL_m5LYQJI", "channel": "Răzvan Ispas", "published_at": "2026-02-09T05:19:15Z", "topic": "Loss Functions & Information Theory (Entropy, KL Divergence)", "embeddable": true, "description": "Mathematics can be fun when you connect all the pieces of the puzzle :) \nDive into the fundamentals of information theory with this concise and engaging explanation of Shannon entropy, cross-entropy, and Kullback-Leibler (KL) divergence. \n\nThe mathematical proofs come from Cristopher Bishop's book: Pattern Recognition and Machine Learning, Chapter 1.6. \n\nTimestamps: \n\n0:00 Intro\n0:43 Shanon Entropy\n8:48 Cross Entropy\n11:46 KL Divergence\n\n\n🔗 Links: \n\nLinkedIn: https://www.linkedin.com/in/razvanip/\nGitHub:  https://github.com/Razvanip13\nTwitter: https://twitter.com/Razvanip\n\n\nThe music used in t"}, {"title": "Lecture 3 | Loss Functions and Optimization", "video_id": "h7iBpEHGVNc", "channel": "Stanford University School of Engineering", "published_at": "2026-02-06T06:32:26Z", "topic": "Linear Classifiers", "embeddable": true, "description": "Lecture 3 continues our discussion of linear classifiers. We introduce the idea of a loss function to quantify our unhappiness with a model’s predictions, and discuss two commonly used loss functions for image classification: the multiclass SVM loss and the multinomial logistic regression loss. We introduce the idea of regularization as a mechanism to fight overfitting, with weight decay as a concrete example. We introduce the idea of optimization and the stochastic gradient descent algorithm. We also briefly discuss the use of feature representations in computer vision.\n\nKeywords: Image class"}, {"title": "Lecture 15 | Efficient Methods and Hardware for Deep Learning", "video_id": "eZdOkDtYMoo", "channel": "Stanford University School of Engineering", "published_at": "2026-02-06T06:00:31Z", "topic": "Hardware & Distributed Training", "embeddable": true, "description": "In Lecture 15, guest lecturer Song Han discusses algorithms and specialized hardware that can be used to accelerate training and inference of deep learning workloads. We discuss pruning, weight sharing, quantization, and other techniques for accelerating inference, as well as parallelization, mixed precision, and other techniques for accelerating training. We discuss specialized hardware for deep learning such as GPUs, FPGAs, and ASICs, including the Tensor Cores in NVIDIA’s latest Volta GPUs as well as Google’s Tensor Processing Units (TPUs).\n\nKeywords: Hardware, CPU, GPU, ASIC, FPGA, pruning"}, {"title": "Stanford CS149 I Parallel Computing I 2023 I Lecture 10 - Efficiently Evaluating DNNs on GPUs", "video_id": "qbKtU0X6-WU", "channel": "Stanford Online", "published_at": "2026-02-04T08:08:11Z", "topic": "Hardware & Distributed Training", "embeddable": false, "description": "Efficiently scheduling DNN layers, mapping convs to matrix-multiplication, transformers, layer fusion\n\nTo follow along with the course, visit the course website: \nhttps://gfxcourses.stanford.edu/cs149/fall23/\n\nKayvon Fatahalian\nAssociate Professor of Computer Science, Stanford University\nhttps://graphics.stanford.edu/~kayvonf/\n\nKunle Olukotun\nCadence Design Systems Professor, Professor of Electrical Engineering and of Computer Science, Stanford University\nhttps://engineering.stanford.edu/people/oyekunle-olukotun\n\nLearn more about the online course and how to enroll: https://online.stanford.edu"}, {"title": "NLP Demystified 14: Machine Translation With Sequence-to-Sequence and Attention", "video_id": "tvIzBouq6lk", "channel": "Future Mojo", "published_at": "2026-02-04T06:54:55Z", "topic": "Neural Language Models (NLMs)", "embeddable": true, "description": "Course playlist: https://www.youtube.com/playlist?list=PLw3N0OFSAYSEC_XokEcX8uzJmEZSoNGuS\n\nWhether it's translation, summarization, or even answering questions, a lot of NLP tasks come down to transforming one type of sequence into another. In this module, we'll learn to do that using encoders and decoders. We'll then look at the weaknesses of the standard approach, and enhance our model with Attention. In the demo, we'll build a model to translate languages for us.\n\nColab notebook: https://colab.research.google.com/github/futuremojo/nlp-demystified/blob/main/notebooks/nlpdemystified_seq2seq_a"}, {"title": "Stanford CS230: Deep Learning | Autumn 2018 | Lecture 2 - Deep Learning Intuition", "video_id": "AwQHqWyHRpU", "channel": "Stanford Online", "published_at": "2026-01-28T06:00:08Z", "topic": "Deep Learning Frameworks (PyTorch/TensorFlow)", "embeddable": false, "description": "Andrew Ng, Adjunct Professor & Kian Katanforoosh, Lecturer - Stanford University\nhttps://stanford.io/3eJW8yT\n\nAndrew Ng\nAdjunct Professor, Computer Science\n\nKian Katanforoosh \nLecturer, Computer Science\n \nTo follow along with the course schedule and syllabus, visit: \nhttp://cs230.stanford.edu/"}, {"title": "MIT 6.S191 (2023): Convolutional Neural Networks", "video_id": "NmLK_WQBxB4", "channel": "Alexander Amini", "published_at": "2026-01-27T1 video_id": "DrhJLHiia7g", "channel": "Professor Bryce", "published_at": "2025-07-20T10:17:34Z", "topic": "Deep Learning Architectures", "embeddable": true, "description": "Davidson CSC 381: Deep Learning, Fall 2022"}, {"title": "Distilling the Knowledge in a Neural Network", "video_id": "k63qGsH1jLo", "channel": "Kapil Sachdeva", "published_at": "2025-07-10T06:50:01Z", "topic": "Model Quantization & Compression", "embeddable": true, "description": "This is the first and foundational paper that started the research area of Knowledge Distillation. \n\nKnowledge Distillation is a study of methods and techniques to extract the information from a cumbersome model (also called the Teacher model) and provide it to a simpler model (also called the Student model). Student models are the ones that are used for inference (especially on resource-constrained devices) and are supposed to excel at both accuracy and speed of prediction\n\nLink to the paper:\nhttps://arxiv.org/abs/1503.02531\n\nLink to the summary of the paper:\nhttps://towardsdatascience.com/pa"}, {"title": "Information, Entropy, Cross-Entropy, and KL Divergence", "video_id": "UwhwtTjDP8k", "channel": "Pioneering Proofs", "published_at": "2025-07-07T06:07:16Z", "topic": "Loss Functions & Information Theory (Entropy, KL Divergence)", "embeddable": true, "description": "In this video, I explain KL Divergence in terms of Information Theory"}, {"title": "Few-Shot Learning (2/3): Siamese Networks", "video_id": "4S-XDefSjTM", "channel": "Shusen Wang", "published_at": "2025-07-03T07:10:10Z", "topic": "Self-Supervised & Contrastive Learning", "embeddable": true, "description": "Next Video: https://youtu.be/U6uFOIURcD0\n\nThis lecture introduces the Siamese network. It can find similarities or distances in the feature space and thereby solve few-shot learning.\n\nSides: https://github.com/wangshusen/DeepLearning\n\nLectures on few-shot learning:\n1. Basic concepts: https://youtu.be/hE7eGew4eeg\n2. Siamese networks: https://youtu.be/4S-XDefSjTM\n3. Pretraining and fine-tuning: https://youtu.be/U6uFOIURcD0"}, {"title": "LoRA (Low-rank Adaption of AI Large Language Models) for fine-tuning LLM models", "video_id": "X4VvO3G6_vw", "channel": "AI Bites", "published_at": "2025-07-01T17:46:37Z", "topic": "Fine-Tuning & PEFT (LoRA/QLoRA)", "embeddable": true, "description": "What is LoRA? How does LoRA work? \nLow-Rank Adaptation (LoRA) for Parameter-Efficient LLM Finetuning explained right from Rank Decomposition to how LoRA is suitable for transformers. LoRA is fast becoming (already is?) the go to approach to fine-tuning transformers based models in budget!\n\n\nRELATED LINKS\nPaper Title: LoRA: Low-Rank Adaptation of Large Language Models\nLoRA Paper: https://arxiv.org/abs/2106.09685\nQLoRA Paper: https://arxiv.org/abs/2305.14314\nLoRA official code: https://github.com/microsoft/LoRA\nParameter-Efficient Fine-Tuning (PEFT) Adapters paper: https://arxiv.org/abs/1902.007"}, {"title": "Why AI Can't Think — But Still Outsmarts You", "video_id": "uROyCFqg8Fk", "channel": "MindWorld", "published_at": "2025-07-01T08:33:47Z", "topic": "AI Agents", "embeddable": true, "description": "It doesn’t think. It doesn’t feel. It doesn’t understand.\nAnd yet — it finishes your sentences, answers your questions, and writes better than most people ever could.\n\nIn this video, we break down the uncomfortable truth: modern AI doesn’t “know” anything in the human sense — but it can still beat us at our own game. From the rise of transformers to the mysterious magic of self-attention, you'll finally understand why large language models like GPT feel so intelligent… and why that illusion is both powerful and dangerous.\n\n__________________\n00:00 - What's all the fuss about?\n00:44 - Text-base"}, {"title": "Components Of Stable Diffusion - Stable Diffusion Masterclass", "video_id": "_JZPKbEp6gk", "channel": "deeplizard", "published_at": "2025-06-30T20:10:42Z", "topic": "Self-Supervised & Contrastive Learning", "e n\nResNet contains 150+ layers and can overcome the problem of vanishing gradients.\n\nAs CNNs grow deeper, vanishing gradient tend to occur which negatively impact network performance.\n\nVanishing gradient problem occurs when the gradient is back-propagated to earlier layers which results in a very small gradient. \n\nResNets include “skip connection” feature which enables training of multiple "}, {"title": "Autoencoder Explained", "video_id": "H1AllrJ-_30", "channel": "Siraj Raval", "published_at": "2025-05-30T13:56:53Z", "topic": "Generative Models", "embeddable": true, "description": "How does an autoencoder work? Autoencoders are a type of neural network that reconstructs the input data its given. But we don't care about the output, we care about the hidden representation its learned. Its a lower dimensional compression of the input that preserves its features. We can use this learned representation for tasks like image colorization, dialogue generation, and anomaly detection. \n\nCode for this video (with Coding Challenge):\nhttps://github.com/llSourcell/autoencoder_explained\n\nPlease Subscribe! And like. And comment. That's what keeps me going. \n\nWant more education? Connect"}, {"title": "Simple Explanation of AutoEncoders", "video_id": "3jmcHZq3A5s", "channel": "WelcomeAIOverlords", "published_at": "2025-05-30T13:51:36Z", "topic": "Neural Network Foundations", "embeddable": true, "description": "Join my Foundations of GNNs online course (https://www.graphneuralnets.com)!  \n\nThis video discusses when you might benefit from using Autoencoders and then deep dives into how they work to build your intuition.  The idea of \"denoising autoencoders\" is presented along with ideas for how to use them.\n\nMailing List:  https://blog.zakjost.com/subscribe \nDiscord Server:  https://discord.gg/xh2chKX\nBlog:  https://blog.zakjost.com\nPatreon: https://www.patreon.com/welcomeaioverlords"}, {"title": "The Epistemology of Deep Learning - Yann LeCun", "video_id": "gG5 .com/playlist?list=PL5dTjWUk_cPYztKD7WxVFluHvpBNM28N9\n\n🚨FREE Advanced"}, {"title": "The Incredible Physics Behind AI Images: How DALL-E, Imagen, and MidJourney Work", "video_id": "WkLadFimfcE", "channel": "CompuFlair", "published_at": "2025-03-23T09:14:37Z", "topic": "AI Agents", "embeddable": true, "description": "In this video, Dr. Ardavan (Ahmad) Borzou will discuss the diffusion model in physics and AI.  \n\n🚀 Join the CompuFlair Community to get notified of  \n1- Hands-on problem-solving data science workshops\n2- Updates and news\n3- Data science tips\n🌐 Register at: https://compu-flair.com/user/register\n\nComprehensive Python Checklist (machine learning and more advanced libraries will be covered on a different page):\n🌐 https://compu-flair.com/blogs/programming-basics\n\nChapters:\n00:00 - Introduction\n01:28 - Simplified concept of AI image generation\n02:44 - Langevin equation: particle moving in liquid\n04:"}, {"title": "The Mystery of 'Latent Space' in Machine Learning Explained!", "video_id": "mX2y3NWmaCQ", "channel": "Dylan Curious", "published_at": "2025-05-24T18:54:22Z", "topic": "Research & Literature Review", "embeddable": true, "description": "NEWSLETTER ✉️ https://dylancurious.beehiiv.com\nPATREON 💰 https://patreon.com/DylanCurious (Monthly Video Call)\n\nHey there, Dylan Curious here, delving into the intriguing world of machine learning and, more precisely, the mysterious ‘Latent Space’. Now, if you’ve been immersing yourself into artificial intelligence, you’ve possibly encountered this term but might be grappling with its concept due to its unintuitive nature, especially relating to how our brain comprehends dimensions. The concept is crucial to understanding AI models, including ones like ChatGPT, and today, we’re going to unrave"}, {"title": "AI Explained: Diffusion Models | From Pixel Art To Molecular Design", "video_id": "OtgrQtPHKDg", "channel": "SandboxAQ", "published_at": "2025-05-24T18:01:11Z", "topic": "AI Agents", "embeddable": true, "description": "Curious about how AI-generated images are made and how that is connected to the creation of new materials?  In this video, we explain diffusion models—the technology behind the amazing pixel portraits we get by giving AI simple prompts. \n\nStarting with images of static and gradually transforming them into clear crisp images may seem far-fetched, but that is exactly how diffusion models work. They first learn by adding noise to billions of images, then figure out how to reverse the process to create new images from static. \n\nBut diffusion models aren't just for art. We explore how this techniqu"}, {"title": "Vector-Quantized Variational Autoencoders (VQ-VAEs)", "video_id": "yQvELPjmyn0", "channel": "DeepBean", "published_at": "2025-05-24T16:41:28Z", "topic": "Word Embeddings & Language Representations", "embeddable": true, "description": "The Vector-Quantized Variational Autoencoder (VQ-VAE) forms discrete latent representations, by mapping encoding vectors to a limited size codebook. But, how does it do this, and why would we want to do it anyway?\n\nLink to my video on VAEs: https://www.youtube.com/watch?v=HBYQvKlaE0A&t=963s\n\nTimestamps\n-------------------\n00:00 Introduction\n01:09 VAE refresher\n02:42 Quantization\n04:46 Posterior\n06:09 Prior\n07:06 Learned prior for sampling\n09:55 Reconstruction loss\n10:32 Straight-through estimation\n11:50 Codebook loss\n12:53 Commitment loss\n14:33 Benefits of quantization\n16:58 Application exampl"}, {"title": "How CNNs Work (Convolutional Neural Nets)", "video_id": "3bo8S1pAbqk", "channel": "DeepBean", "published_at": "2025-05-24T16:36:19Z", "topic": "Convolutional Neural Networks (CNNs)", "embeddable": true, "description": "CNNs are a go-to deep learning architecture for many computer vision tasks, from image classification to object detection and more. Here, we take a look at the basics, and see how they use biologically-inspired hierarchical feature extraction to do what they do.\n\nTimestamps\n--------------------\nIntroduction 00:00\nKernel convolutions 00:41\nCommon kernels 02:30\nWhy flipping? 03:30\nConvolution as feature extraction 04:00\nHierarchical feature extraction 05:40\nDown-sizing 07:25\nMax-pooling 09:43\nMulti-channel kernels 10:30\nLearnable kernels 11:04\nCNN architecture 11:52\nResidual connections 14:25\nCo"}, {"title": "What is PyTorch? (Machine/Deep Learning)", "video_id": "fJ40w_2h8kk", "channel": "IBM Technology", "published_at": "2025-05-24T16:32:56Z", "topic": "Deep Learning Frameworks (PyTorch/TensorFlow)", "embeddable": true, "description": "Check out watsonx: https://ibm.biz/BdvDnq\n\nPyTorch is a popular open-source framework for machine learning and deep learning, backed by the PyTorch Foundation. It simplifies data preparation, model building, and training with features like data loaders, pre-defined layers, automatic gradient calculation, and optimization functions. In this video, PyTorch contributor Sahdev Zala and Distinguished Engineer Brad Topol present PyTorch's key features and explain why you should consider becoming a contributor."}, {"title": "Lecture 7 Self-Supervised Learning -- UC Berkeley Spring 2020 - CS294-158 Deep Unsupervised Learning", "video_id": "dMUes74-nYY", "channel": "Pieter Abbeel", "published_at": "2025-05-24T15:41:42Z", "topic": "Self-Supervised & Contrastive Learning", "embeddable": true, "description": "Course homepage:\nhttps://sites.google.com/view/berkeley-cs294-158-sp20/home\nLecture Instructor: Aravind Srinivas\nCourse Instructors: Pieter Abbeel, Aravind Srinivas, Peter Chen, Jonathan Ho, Alex Li, Wilson Yan\nCS294-158-SP20: Deep Unsupervised Learning\nUC Berkeley, Spring 2020"}, {"title": "Revisiting ResNets in 2023", "video_id": "Hi9WasDwU2U", "channel": "Ritwik Raha", "published_at": "2025-05-24T15:40:47Z", "topic": "Convolutional Neural Networks (CNNs)", "embeddable": true, "description": "👋 Welcome to this video summary of the groundbreaking paper on Residual Networks (ResNets)!\n\n📚 Paper Title: \"Deep Residual Learning for Image Recognition\"\n👨‍🔬 Authors: Kaiming He, Xiangyu Zhang, Shaoqing Ren, Jian Sun\n📅 Published Date: 2015\n🔗 Link to Paper: Deep Residual Learning for Image Recognition\n\nImagine playing the game of \"telephone,\" where you whisper a message to the person next to you, and they whisper it to the next person, and so on. Eventually, the message reaches the last person, who reveals what they heard. Often, the message gets distorted along the way due to miscommunication"}, {"title": "Dr Kaiming He- 2023 Future Science Prize Laureates Lecture  何恺明- 2023年未来科学大奖获奖者学术报告会", "video_id": "jEeL5Gf4vkk", "channel": "Future Science Prize", "published_at": "2025-05-24T15:26:53Z", "topic": "Research & Literature Review", "embeddable": true, "description": "The 2023 Future Science Prize Laureate Lecture co-organised by CUHK and the Future Science Prize was successfully held on 16 October 2023. The lecture was delivered by Dr Kaiming He, who shared insights on \"Deep Residual Learning and How It Shaped the AI Landscape\" with over 160 participants. Dr He was honoured with the 2023 Future Science Prize – The Mathematics and Computer Science Prize for his fundamental contributions to artificial intelligence by introducing deep residual learning. Deep residual learning has allowed neural networks to utilize unprecedented depths and unlock capabilities "}, {"title": "Deep Learning Day: Generative Modeling", "video_id": "2yJSoaGU2i4", "channel": "MIT Schwarzman College of Computing", "published_at": "2025-05-24T15:25:35Z", "topic": "Generative Models", "embeddable": true, "description": "Kaiming He, Associate Professor in MIT's Department of Electrical Engineering and Computer Science and member of the Computer Science and Artificial Intelligence Laboratory, gives a talk on generative modeling.\n\nHe's talk was part of Deep Learning Day for the MIT Schwarzman College of Computing's Expanding Horizons in Computing series. Organized by MIT faculty, the series comprised of four sessions that delved into key topics in computing — deep learning, societal impact, cryptography and security, and quantum technology. \n\nWatch more videos from the MIT Schwarzman College of Computing: https:"}, {"title": "CS231n Winter 2016: Lecture 7: Convolutional Neural Networks", "video_id": "LxfUGhug-iQ", "channel": "Andrej Karpathy", "published_at": "2025-05-24T15:23:50Z", "topic": "Convolutional Neural Networks (CNNs)", "embeddable": true, "description": "Stanford Winter Quarter 2016 class: CS231n: Convolutional Neural Networks for Visual Recognition. Lecture 7.\n\nGet in touch on Twitter @cs231n, or on Reddit /r/cs231n."}, {"title": "Week 8 – Lecture: Contrastive methods and regularised latent variable models", "video_id": "ZaVP2SY23nc", "channel": "Alfredo Canziani (冷在)", "published_at": "2025-05-24T08:50:52Z", "topic": "Self-Supervised & Contrastive Learning", "embeddable": true, "description": "Course website: http://bit.ly/DLSP20-web\nPlaylist: http://bit.ly/pDL-YouTube\nSpeaker: Yann LeCun\nWeek 8: http://bit.ly/DLSP20-08\n\n0:00:00 – Week 8 – Lecture\n\nLECTURE Part A: http://bit.ly/DLSP20-08-1\nIn this section, we focused on the introduction of contrastive methods in Energy-Based Models in several aspects. First, we discuss the advantage brought by applying contrastive methods in self-supervised learning. Second, we discussed the architecture of denoising autoencoders and their weakness in image reconstruction tasks. We also talked about other contrastive methods, like contrastive diverg"}, {"title": "Week 5 – Lecture: Optimisation", "video_id": "--NZb480zlg", "channel": "Alfredo Canziani (冷在)", "published_at": "2025-05-24T06:56:42Z", "topic": "Optimization Algorithms (SGD, Adam, Momentum)", "embeddable": true, "description": "Course website: http://bit.ly/DLSP20-web\nPlaylist: http://bit.ly/pDL-YouTube\nSpeaker: Aaron DeFazio\nWeek 5: http://bit.ly/DLSP20-05\n\n0:00:00 – Week 5 – Lecture\n\nLECTURE Part A: http://bit.ly/DLSP20-05-1\nWe begin by introducing Gradient Descent. We discuss the intuition and also talk about how step sizes play an important role in reaching the solution. Then we move on to SGD and its performance in comparison to Full Batch GD. Finally we talk about Momentum Updates, specifically the two update rules, the intuition behind momentum and its effect on convergence.\n0:01:28 – Gradient Descent\n0:14:58 "}, {"title": "Week 1 – Lecture: History, motivation, and evolution of Deep Learning", "video_id": "0bMe_vCZo30", "channel": "Alfredo Canziani (冷在)", "published_at": "2025-05-24T06:46:10Z", "topic": "Deep Learning Frameworks (PyTorch/TensorFlow)", "embeddable": true, "description": "Course website: https://bit.ly/DLSP20-web\nPlaylist: http://bit.ly/pDL-YouTube\nSpeaker: Yann LeCun\nWeek 1: http://bit.ly/DLSP20-01\n\n0:00:00 – Week 1 – Lecture\n\nLECTURE Part A: http://bit.ly/DLSP20-01-1\nWe discuss the motivation behind deep learning. We begin with the history and inspiration of deep learning. Then we discuss the history of pattern recognition and introduce gradient descent and its computation by backpropagation. Finally, we discuss the hierarchical representation of the visual cortex.\n0:03:37 – Inspiration of Deep Learning and Its History, Supervised Learning\n0:24:21 – History o"}, {"title": "Week 10 – Lecture: Self-supervised learning (SSL) in computer vision (CV)", "video_id": "0KeR6i1_56g", "channel": "Alfredo Canziani (冷在)", "published_at": "2025-05-24T06:38:39Z", "topic": "Self-Supervised & Contrastive Learning", "embeddable": true, "description": "Course website: http://bit.ly/DLSP20-web\nPlaylist: http://bit.ly/pDL-YouTube\nSpeaker: Ishan Misra\nWeek 10: http://bit.ly/DLSP20-10\n\n0:00:00 – Week 10 – Lecture\n\nLECTURE Part A: http://bit.ly/DLSP20-10-1\nIn this section, we understand the motivation behind Self-Supervised Learning (SSL), define what it is and see some of its applications in NLP and Computer Vision. We understand how pretext tasks aid with SSL and see some example pretext tasks in images, videos and videos with sound. Finally, we try to get an intuition behind the representation learned by pretext tasks.\n0:01:15 – Challenges of "}, {"title": "Self-Supervised Learning", "video_id": "lbKg3OSTsgA", "channel": "Connor Shorten", "published_at": "2025-05-24T06:36:36Z", "topic": "Self-Supervised & Contrastive Learning", "embeddable": true, "description": "This video presents a study from Google AI research on revisiting self-supervised visual representation learning. Their study throws modern networks such as the RevNet and ResNet v2 at self-supervised learning tasks such as rotation prediction and jigsaw puzzle / permutation prediction!\nThanks for watching, Please Subscribe!\n\nPaper Link: https://arxiv.org/pdf/1901.09005.pdf"}, {"title": "LoRA & QLoRA Fine-tuning Explained In-Depth", "video_id": "t1caDsMzWBk", "channel": "Mark Hennings", "published_at": "2025-05-24T06:26:31Z", "topic": "Fine-Tuning & PEFT (LoRA/QLoRA)", "embeddable": true, "description": "In this video, I dive into how LoRA works vs full-parameter fine-tuning, explain why QLoRA is a step up, and provide an in-depth look at the LoRA-specific hyperparameters: Rank, Alpha, and Dropout.\n\n0:26 - Why We Need Parameter-efficient Fine-tuning\n1:32 - Full-parameter Fine-tuning\n2:19 - LoRA Explanation\n6:29 - What should Rank be?\n8:04 - QLoRA and Rank Continued\n11:17 - Alpha Hyperparameter\n13:20 - Dropout Hyperparameter\n\nReady to put it into practice? Try LoRA fine-tuning at www.entrypointai.com"}, {"title": "Deep Dive on PyTorch Quantization - Chris Gottbrath", "video_id": "c3MT2qV5f9w", "channel": "PyTorch", "published_at": "2025-05-24T06:21:31Z", "topic": "Model Quantization & Compression", "embeddable": true, "description": "Learn more: https://pytorch.org/docs/stable/quantization.html\n\nIt’s important to make efficient use of both server-side and on-device compute resources when developing machine learning applications. To support more efficient deployment on servers and edge devices, PyTorch added a support for model quantization using the familiar eager mode Python API.\n\nQuantization leverages 8bit integer (int8) instructions to reduce the model size and run the inference faster (reduced latency) and can be the difference between a model achieving quality of service goals or even fitting into the resources avail"}, {"title": "Coding Stable Diffusion from scratch in PyTorch", "video_id": "ZBKpAp_6TGI", "channel": "Umar Jamil", "published_at": "2025-05-24T06:17:16Z", "topic": "Deep Learning Frameworks (PyTorch/TensorFlow)", "embeddable": true, "description": "Full coding of Stable Diffusion from scratch, with full explanation, including explanation of the mathematics. Visual explanation of text-to-image, image-to-image, inpainting\n\nRepository with PDF slides: https://github.com/hkproj/pytorch-stable-diffusion\n\nPrerequisites:\n1) Transformer explained: https://www.youtube.com/watch?v=bCz4OMemCcA\n\nChapters\n00:00:00 - Introduction\n00:04:30 - What is Stable Diffusion?\n00:05:40 - Generative Models\n00:12:07 - Forward and Reverse Process\n00:17:44 - ELBO and Loss\n00:20:30 - Generating New Data\n00:22:20 - Classifier-Free Guidance\n00:31:00 - CLIP\n00:33:20 - V"}, {"title": "Building a Neural Network with PyTorch in 15 Minutes | Coding Challenge", "video_id": "mozBidd58VQ", "channel": "Nicholas Renotte", "published_at": "2025-05-24T06:10:08Z", "topic": "Deep Learning Frameworks (PyTorch/TensorFlow)", "embeddable": true, "description": "What's happening guys, welcome to the third episode of CodeThat!\n\nIn this ep I try to build my first neural network in PyTorch...seriously the first time I even dug into their documentation was yesterday! Anyway you know the rules I have to get it done in 15 minutes, no doco or stack overflow and a gift card to you guys if I fail. \n\nWill I make it in time???!\n\nGet the Code: https://github.com/nicknochnack/PyTorchin15\n\nOh, and don't forget to connect with me!\nLinkedIn: https://bit.ly/324Epgo\nFacebook: https://bit.ly/3mB1sZD\nGitHub: https://bit.ly/3mDJllD\nPatreon: https://bit.ly/2OCn3UW\nJoin the"}, {"title": "The Breakthrough Behind Modern AI Image Generators | Diffusion Models Part 1", "video_id": "1pgiu--4W3I", "channel": "Depth First", "published_at": "2025-03-23T08:10:17Z", "topic": "Generative Models", "embeddable": true, "description": "Diffusion models are a key innovation with far-reaching impacts on multiple fields in machine learning, being the technology behind OpenAI's DALL-E and Sora, Google's Imagen, Stable Diffusion, Midjourney, and more. Developed initially for image generation, they only seem to be increasing in importance as recent releases like NVIDIA's Cosmos, Physical Intelligence's Pi Zero, Google's Veo, etc. all use the same diffusion principles.\n\nDespite its pivotal role in modern AI, I have never found an explanation for how they work that helps me really understand them. This is the video I always wished I"}, {"title": "Self-supervised vision", "video_id": "UaJDdft6BdI", "channel": "Samuel Albanie", "published_at": "2025-05-24T04:30:27Z", "topic": "Self-Supervised & Contrastive Learning", "embeddable": true, "description": "An overview of the use of self-supervised learning in Computer Vision.\n\nTimestamps:\n00:00 - Self-supervised vision\n00:29 - Self-supervised learning - motivation\n01:39 - Self-supervised learning - motivation (cont.)\n04:11 - Self-supervised learning - creating your own supervision\n05:38 - Self-supervised learning - creating your own supervision (cont.)\n06:32 - Self-supervised learning - creating your own supervision (cont. cont.)\n07:36 - Self-supervised learning - context as supervision\n09:09 - Back to vision: context as supervision\n11:39 - Pretext task: inpainting\n13:30 - Pretext task: jigsaw p"}, {"title": "Contrastive Language-Image Pretraining (CLIP)", "video_id": "Rvy1SrgQlDk", "channel": "Antonio Rueda-Toicen", "published_at": "2025-05-23T16:23:04Z", "topic": "Self-Supervised & Contrastive Learning", "embeddable": true, "description": "GitHub repository: https://github.com/andandandand/practical-computer-vision\n\n0:00 CLIP: Contrastive Language-Image Pretraining\n0:08 Learning goals\n0:30 CLIP: ‘Contrastive Language Image Pretraining’\n1:37 Aligning text and image embeddings\n2:58 Text encoders\n4:12 CLIP’s architecture\n5:11 Maximizing cosine similarity of matching text and image embeddings\n5:45 Training algorithm\n6:18 Zero-shot classification with CLIP\n7:21 Producing embeddings with CLIP (1/2)\n7:49 Producing embeddings with CLIP (2/2)\n8:47 Zero-shot classification with CLIP (Note: Same title as 6:18, but slide focuses on code/sof"}, {"title": "OpenAI's CLIP Explained and Implementation | Contrastive Learning | Self-Supervised Learning", "video_id": "GLa7z5rkSf4", "channel": "Karndeep Singh", "published_at": "2025-05-23T16:21:53Z", "topic": "Self-Supervised & Contrastive Learning", "embeddable": true, "description": "CLIP (Contrastive Language-Image Pre-Training) is a neural network trained on a variety of (image, text) pairs. It can be instructed in natural language to predict the most relevant text snippet, given an image, without directly optimizing for the task, similarly to the zero-shot capabilities of GPT-2 and 3. We found CLIP matches the performance of the original ResNet50 on ImageNet “zero-shot” without using any of the original 1.28M labeled examples, overcoming several major challenges in computer vision.\n\n\n\n\nOpenAI/CLIP github : https://github.com/openai/CLIP\n\nNotebook :https://www.kaggle.com"}, {"title": "DALL-E: Generates Images from Text", "video_id": "-TMy_fzSDHw", "channel": "Connor Shorten", "published_at": "2025-05-23T16:12:42Z", "topic": "Vision-Language & Multimodal Models", "embeddable": true, "description": "This video is a quick explanation of the DALL-E model from OpenAI. I hope this makes it clear how text and images are unified as tensors in Deep Neural Networks!\n\nLinks:\nDALL-E: https://openai.com/blog/dall-e/\nThe Illustrated Transformer: http://jalammar.github.io/illustrated-transformer/\nAttention is all you Need: https://arxiv.org/abs/1706.03762"}, {"title": "Get to Know PyTorch - A Cutting Edge Open Source AI Framework for Deep Learning - Sahdev Zala, IBM", "video_id": "5Ca06hCv2ko", "channel": "The Linux Foundation", "published_at": "2025-05-23T10:29:31Z", "topic": "Deep Learning Frameworks (PyTorch/TensorFlow)", "embeddable": true, "description": "Get to Know PyTorch - A Cutting Edge Open Source AI Framework for Deep Learning - Sahdev Zala, IBM\n\nPyTorch has emerged as a leading open source framework for AI research and commercial production for key facets of deep learning. Created initially at Meta, it has moved under the Linux Foundation umbrella as the PyTorch Foundation to accelerate progress in AI. The foundation was created in September 2022, the project continues to evolve, and many exciting things are happening in the project. In this talk we provide an overview of deep learning, PyTorch fundamentals, and the latest developments "}, {"title": "What is Self-Supervised Learning? [Quick Introduction]", "video_id": "bfCs3wqRSQY", "channel": "AISyndicate", "published_at": "2025-05-23T08:45:24Z", "topic": "Self-Supervised & Contrastive Learning", "embeddable": true, "description": "In this video, we give a quick five-minute introduction to one of the hottest topics in Deep Learning: Self-Supervised Learning. The video is supposed to give you an intuition on the topic and motivate you to learn more about the amazing research in the space.\n\nFive-Minute Concepts aims to give quick and easy to understand five minute intros to some of the hot topics in Deep Learning. Subscribe to watch more! \n\nContents of this video\n0:00 Intro\n0:23 Review of Supervised Learning\n0:57 Problem with Supervised Learning\n1:29 Review of Transfer Learning\n3:22 Self-Supervised Learning Explained\n\nFoll"}, {"title": "What Is Self-Supervised Learning and Why Care?", "video_id": "iGJ1XSkCyU0", "channel": "Boris Meinardus", "published_at": "2025-05-23T08:40:33Z", "topic": "Self-Supervised & Contrastive Learning", "embeddable": true, "description": "What is Self-Supervised Learning?\n“Self-Supervised methods […] are going to be the main method to train neural nets before we train them for difficult tasks”  —  Yann LeCun\nLet’s discover the fascinating machine learning domain of Self-Supervised Learning!\nIt is one of the most important machine learning techniques in the current day and age.\nSo, in this first video of the series we will motivate the idea of representation learning using Self-Supervised Learning!\n\n👾 Join the discord server!\nhttps://discord.gg/n2sB3ZXpFy\n\nSources of clips used:\nhttps://www.youtube.com/watch?v=9dLd6n9yT8U\nhttps:"}, {"title": "Segment Anything Model (SAM) Breakdown | Computer Vision Breakthrough", "video_id": "umurJ8GsuH0", "channel": "Roboflow", "published_at": "2025-05-23T08:14:20Z", "topic": "Vision-Language & Multimodal Models", "embeddable": true, "description": "Facebook released the Segment Anything model showcasing impressive zero-shot inference capabilities and comes with the promise of becoming a new foundational model for computer vision applications.\n\nAccompanying blog post: https://blog.roboflow.com/segment-anything-breakdown/\n\nUse SAM in Roboflow to label data: https://blog.roboflow.com/label-data-segment-anything-model-sam/\n\nAutomated data labeling with SAM: https://youtu.be/oEQYStnF2l8\n\nInteractive Segment Anything Experience: https://segment-anything.com/\n\nGithub repo: https://github.com/facebookresearch/segment-anything\n\narXiv paper: https"}, {"title": "The entire history of Computer Vision explained one core concept at a time.", "video_id": "N_PocrMHWbw", "channel": "Neural Breakdown with AVB", "published_at": "2025-05-23T00:47:38Z", "topic": "Convolutional Neural Networks (CNNs)", "embeddable": true, "description": "In this video, we are going to go through the history of CNNs specifically for Image Classification tasks – starting from those early research years, to the golden era of the mid 2010s when many of the most genius Deep Learning architectures ever were conceived, and finally discuss the latest trends in CNN research now as they compete with attention and vision-transformers.\n\n\nMembers can now access the full write-up, all the animations, powerpoint slides, and more side-content from this video! \n\nVisit the Patreon link to see what is available: \nhttps://www.patreon.com/NeuralBreakdownwithAVB \n\n"}, {"title": "What are Transformer Neural Networks?", "video_id": "XSSTuhyAmnI", "channel": "Ari Seff", "published_at": "2025-05-23T00:22:14Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "This short tutorial covers the basics of the Transformer, a neural network architecture designed for handling sequential data in machine learning.\n\nTimestamps:\n0:00 - Intro\n1:18 - Motivation for developing the Transformer\n2:44 - Input embeddings (start of encoder walk-through)\n3:29 - Attention\n6:29 - Multi-head attention\n7:55 - Positional encodings\n9:59 - Add & norm, feedforward, & stacking encoder layers\n11:14 - Masked multi-head attention (start of decoder walk-through)\n12:35 - Cross-attention\n13:38 - Decoder output & prediction probabilities\n14:46 - Complexity analysis\n16:00 - Transformers "}, {"title": "How optimization for machine learning works, part 1", "video_id": "x6f5JOPhci0", "channel": "Brandon Rohrer", "published_at": "2025-05-22T09:24:37Z", "topic": "Optimization Algorithms (SGD, Adam, Momentum)", "embeddable": true, "description": "Part of the End-to-End Machine Learning School course library at http://e2eml.school\n\nSee these concepts used in an End to End Machine Learning project:\nhttps://end-to-end-machine-learning.teachable.com/p/polynomial-regression-optimization/\nWatch the rest of the How Optimization Works serie
