ons, visit our website or follow TensorFlow code tutorials on our GitHub repo.\n\nINFO:\nWebsite: https://deeplearning.mit.edu\nGitHub: https://github.com/lexfridman/mit-deep-learning\nSlides: http://bit.ly/deep-learning-basics-slides\nPlaylist: http"}, {"title": "Lukasz Kaiser at AI Frontiers 2017: One Model to Learn It All", "video_id": "8FpdEmySsuc", "channel": "AI Frontiers", "published_at": "2025-05-21T08:44:23Z", "topic": "Deep Learning Architectures", "embeddable": true, "description": "Deep learning yields great results across many fields, from speech recognition, image classification, to translation. But for each problem, getting a deep model to work well involves research into the architecture and a long period of tuning. We present a single model that yields good results spanning multiple domains. This single model is trained concurrently on ImageNet, multiple translation tasks, image captioning, a speech recognition corpus, and an English parsing task. We achieved state-of-the-art performance while training much quicker and generating long coherent pieces, even on the sc"}, {"title": "Turns out Attention wasn't all we needed - How have modern Transformer architectures evolved?", "video_id": "mVLO9PHFc0I", "channel": "Neural Breakdown with AVB", "published_at": "2025-05-21T05:10:03Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "In this video, we discuss the evolution of the classic Neural Attention mechanism from early adoptions of Bahnadau Attention and more specifically Self-Attention and Causal Masked Attention introduced in the seminal \"Attention is all you need\" paper. This video discusses more advanced forms of the Multi Headed Attention such as Multi Query Attention and Grouped Query Attention. Along the way, we also talk about important innovations in the Transformers and Large Language Models (LLMs) architecture, such as KV Caching. The video contains visualizations and graphics to further explain these conc"}, {"title": "Some Fundamental Architectural Elements", "video_id": "q5XUXZ0K4m8", "channel": "Deep Foundations", "published_at": "2025-05-20T15:06:11Z", "topic": "Neural Network Foundations", "embeddable": true, "description": "This describes the motivation for RELU, initialization methods, normalization layers and residual connections."}, {"title": "Lecture 1:  A Survey of Deep Learning", "video_id": "ONrkO9QIryA", "channel": "Deep Foundations", "published_at": "2025-05-20T14:41:13Z", "topic": "Neural Network Foundations", "embeddable": true, "description": "This presents a timeline of deep learning from the perspective of when and where current methods were introduced."}, {"title": "Understanding Binary Cross-Entropy / Log Loss in 5 minutes: a visual explanation", "video_id": "DPSXVJF5jIs", "channel": "Daniel Godoy", "published_at": "2025-05-20T14:03:00Z", "topic": "Loss Functions & Information Theory (Entropy, KL Divergence)", "embeddable": true, "description": "If you are training a binary classifier, chances are you are using binary cross-entropy / log loss as your loss function.\nHave you ever thought about what exactly does it mean to use this loss function? This video explains the concepts behind binary cross-entropy / log loss in a visually clear and concise manner.\nThe content of this video is also available in the corresponding blog post: https://towardsdatascience.com/understanding-binary-cross-entropy-log-loss-a-visual-explanation-a3ac6025181a"}, {"title": "Why We Don't Use the Mean Squared Error (MSE) Loss in Classification", "video_id": "bNwI3IUOKyg", "channel": "DataMListic", "published_at": "2025-05-20T14:01:11Z", "topic": "Linear Classifiers", "embeddable": true, "description": "In this video we discuss why the mean squared error (MSE) loss is not used for classification problems. We take a look at three important aspects: (1) the MSE assumes a gaussian prior, (2) the MSE applied on classification problems results in a non-convex function and aping the project management domain. Uncover the depths of LLMs, their intricate workings, and their significant impact on the field of project management. This video is your gateway to understanding the next frontier in AI-driven project management enhancement.\n\n🔍 What You'll Learn:\n\n- Fundamentals of Large Language Models (LLMs) and their differentiation from other AI models like GPT.\n- The "}, {"title": "Building Production-Ready RAG Applications: Jerry Liu", "video_id": "TRjq7t2Ms5I", "channel": "AI Engineer", "published_at": "2024-04-06T05:56:34Z", "topic": "Retrieval-Augmented Generation (RAG) & Vector Search", "embeddable": true, "description": "Large Language Models (LLM's) are starting to revolutionize how users can search for, interact with, and generate new content. Some recent stacks and toolkits around Retrieval Augmented Generation (RAG) have emerged where users are building applications such as chatbots using LLMs on their own private data. This opens the door to a vast array of applications. However while setting up a naive RAG stack is easy, productionizing it is hard. In this talk, we talk about core techniques for evaluating and improving your retrieval systems for better performing RAG.\n\nRecorded live in San Francisco at "}, {"title": "Using pre-trained models in TensorFlow | Machine Learning for web developers", "video_id": "iTlj3gMYzw8", "channel": "Google for Developers", "published_at": "2024-04-06T05:52:22Z", "topic": "MLOps & Pipelines", "embeddable": true, "description": "Prototype ideas faster and save time going into production by using pre-trained models. These machine learning models have already been trained by someone else and for some cases are ready to be used for production. From object detection to sound recognition or pose estimation and body segmentation – you can do advanced things easily with TensorFlow.js pre-made models. \n\nWhat are pre-trained models? \nIn this Google for Developers introduction, you'll discover the pre-trained models in TensorFlow that are free to use out of the box and see how to use them in just a few lines of code. \n\nUse case"}, {"title": "10 years of NLP history explained in 50 concepts | From Word2Vec, RNNs to GPT", "video_id": "uocYQH0cWTs", "channel": "Neural Breakdown with AVB", "published_at": "2025-06-17T17:53:48Z", "topic": "Neural Language Models (NLMs)", "embeddable": true, "description": "From RNNs to Transformers to GPT-4, the leap in intelligence in Deep Learning research for Language Modelling and NLP has been a steady and educational growth. In this video, I explain 50 concepts that cover the basics of NLP like Tokenization and Word Embeddings, to seminal work like RNNs, Seq2Seq, Attention, to innovative Transformer models like BERT, GPT, XL-Net, and InstructGPT. I present the challenges we have faced in previous designs, and what the current architectures do to improve it, as well as highlight areas of improvement for future research.\n\nTo support the channel and access the"}, {"title": "How to train English to Hindi Language Translator Model using Transformers | Hugging Face 🤗", "video_id": "NwubVF3tXe4", "channel": "DSwithBappy", "published_at": "2024-04-05T19:27:28Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "Code : https://github.com/entbappy/NLP-Projects-Notebooks\n \nAn English to Hindi language translator is a tool or software that enables the translation of text or spoken words from the English language to the Hindi language. It takes input in English and provides the corresponding translation in Hindi. This type of translator helps users understand and communicate in Hindi, especially when they are not familiar with the language or need assistance in translating English content to Hindi. These translators can be available in various forms, such as online translation websites, mobile application"}, {"title": "Introduction to NLP & All About NLP Pipelines | Natural Language Processing", "video_id": "ruyyyRp79uQ", "channel": "DSwithBappy", "published_at": "2024-04-05T19:26:33Z", "topic": "Neural Language Models (NLMs)", "embeddable": true, "description": "Natural language processing is an interdisciplinary subfield of linguistics, computer science, and artificial intelligence concerned with the interactions between computers and human language, in particular how to program computers to process and analyze large amounts of natural language data. In this session, I have covered all about NLP & its pipeline.\n\nCheck out my other playlists:\n► Complete Python Programming: https://youtube.com/playlist?list=PLkz_y24mlSJaY8YuDJniDw-naFVMac-3k\n► 100 Days of  Machine Learning playlist: https://youtube.com/playlist?list=PLkz_y24mlSJY0Zh22f4n_sOvhObBaY1yL\n►"}, {"title": "Generative AI for business", "video_id": "FrDnPTPgEmk", "channel": "IBM Research", "published_at": "2024-04-05T18:43:47Z", "topic": "AI Product Strategy", "embeddable": true, "description": "#AI #GenerativeAI #Watson \nWe are witnessing a fundamental shift in AI driven by self-supervision and by the ability to create foundation models that power generative AI. Join Darío Gil, SVP and Director of IBM Research as he demystifies the technology and shares a set of principles to guide your generative AI business strategy. Experience watsonx, IBM’s new data and AI platform for generative AI and learn about the breakthroughs that IBM Research is bringing to this platform and to the world of computing.\n\nLearn more: https://www.ibm.com/watsonx\n\nSubscribe and stay up to date on news and anno"}, {"title": "Semantic Search: A Deep Dive Into Vector Databases (with Zain Hasan)", "video_id": "kS9DazKNX-Y", "channel": "Developer Voices", "published_at": "2024-04-05T16:15:46Z", "topic": "Retrieval-Augmented Generation (RAG) & Vector Search", "embeddable": true, "description": "As interesting and useful as LLMs (Large Language Models) are proving, they have a severe limitation: they only know about the information they were trained on. If you train it on a snapshot of the internet from 2023, it’ll think it’s 2023 forever. So what do you do if you want to teach it some new information, but don’t want to burn a million AWS credits to get there?\n\nIn exploring that answer, we dive deep into the world of semantic search, augmented LLMs, and exactly how vector databases bridge that gap from the old dog to the new tricks. Along the way we’ll go from an easy trick to teach C"}, {"title": "Transformer (Decoder); Pretraining & Finetuning", "video_id": "x3sAlTERozo", "channel": "UofU Data Science", "published_at": "2024-04-03T17:05:10Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "0:00 Lecture starts"}, {"title": "What does it mean for computers to understand language? | LM1", "video_id": "1il-s4mgNdI", "channel": "vcubingx", "published_at": "2024-04-02T18:20:22Z", "topic": "Neural Language Models (NLMs)", "embeddable": true, "description": "An introduction to language modeling, followed by an explanation of the N-Gram language model!\nSupport me on Patreon! https://patreon.com/vcubingx\nPart 2! https://youtu.be/rTz6hadM1Lg\n\n3blue1brown series on Transformers: https://youtu.be/wjZofJX0v4M\n\nThe source code for the animations can be found here:\nhttps://github.com/vivek3141/dl-visualization\n\nThese animation in this video was made using 3blue1brown's library, manim:\nhttps://github.com/3b1b/manim\n\nSources (includes the entire series): https://docs.google.com/document/d/1e9dB6Q-A6z1d33w2m0_DrMS5EdbSunY2TPvZmZf41Gc/edit\n\nChapters\n0:00 Intr"}, {"title": "Transformers, the tech behind LLMs | Deep Learning Chapter 5", "video_id": "wjZofJX0v4M", "channel": "3Blue1Brown", "published_at": "2024-04-02T06:52:39Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "Breaking down how Large Language Models work, visualizing how data flows through.\nInstead of sponsored ad reads, these lessons are funded directly by viewers: https://3b1b.co/support\n\n---\n\nHere are a few other relevant resources\n\nBuild a GPT from scratch, by Andrej Karpathy\nhttps://youtu.be/kCc8FmEb1nY\n\nIf you want a conceptual understanding of language models from the ground up, @vcubingx just started a short series of videos on the topic:\nhttps://youtu.be/1il-s4mgNdI?si=XaVxj6bsdy3VkgEX\n\nIf you're interested in the herculean task of interpreting what these large networks might actually be do"}, {"title": "12 | Neural Language Models | TTIC 31190 (NLP) - Fall 2020", "video_id": "Oe01fr0w0YU", "channel": "Kevin Gimpel NLP", "published_at": "2024-03-31T19:29:18Z", "topic": "Neural Language Models (NLMs)", "embeddable": true, "description": ""}, {"title": "Introduction to large language models", "video_id": "zizonToFXDs", "channel": "Google Cloud Tech", "published_at": "2024-03-31T19:01:51Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "Enroll in this course on Google Cloud Skills Boost → https://goo.gle/3nXSmLs\n\nLarge Language Models (LLMs) and Generative AI intersect and they are both part of deep learning. Watch this video to learn about LLMs, including use cases, Prompt Tuning, and GenAI development tools.\n\nSubscribe to Google Cloud Tech → https://goo.gle/GoogleCloudTech"}, {"title": "LM.2 What is a language model?", "video_id": "W0TcVrI_vRg", "channel": "Victor Lavrenko", "published_at": "2024-03-31T18:12:26Z", "topic": "Neural Language Models (NLMs)", "embeddable": true, "description": ""}, {"title": "3 1 Introduction to N grams 8 41", "video_id": "hM49MPmakNI", "channel": "From Languages to Information", "published_at": "2024-03-31T18:03:26Z", "topic": "Neural Network Foundations", "embeddable": true, "description": ""}, {"title": "How Large Language Models Work", "video_id": "5sLYAQS9sWQ", "channel": "IBM Technology", "published_at": "2024-03-31T18:02:29Z", "topic": "Large Language Models (LLMs) & Pretraining", "embed o provides expert guidance on techni"}, {"title": "N-gram Language Modeling | Theory, Math, Code", "video_id": "Vc2C1NZkH0E", "channel": "Learn With Yash Agrawal", "published_at": "2024-03-30T07:10:27Z", "topic": "Neural Language Models (NLMs)", "embeddable": true, "description": "Video introduces you to building a simple n-gram based language model.\n\nLink for code and slides: https://github.com/yashbuild/Learn-With-Yash-Agrawal/tree/main/General_NLP/N-gram_Language_Modeling"}, {"title": "Masked Language Modeling (MLM) in BERT pretraining explained", "video_id": "fmnFOzmdUBE", "channel": "Data Science in your pocket", "published_at": "2024-03-30T07:09:41Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "Masked Language Modeling is a way of training using which BERT model is pre trained before fine-tuning it for any specific task. \n#artificialintelligence #datascience #machinelearning #nlp #bert"}, {"title": "What is a Masked Language Model (MLM)? Masked vs. Causal AI", "video_id": "yy4-aepVly4", "channel": "Eye on Tech", "published_at": "2024-03-30T07:08:11Z", "topic": "Neural Language Models (NLMs)", "embeddable": true, "description": "Masked language models, or MLMs, have something other language models don't -- masked tokens. That means, they intentionally block words in training to better understand context and semantics. MLMs stand in contrast to traditional AI models, also known as causal AI models. \n\nRead more: \nhttps://www.techtarget.com/searchenterpriseai/definition/masked-language-models-MLMs\nhttps://www.techtarget.com/whatis/definition/Hugging-Face\n\nSubscribe to Eye on Tech: https://www.youtube.com/@EyeonTech \nFollow us on X: https://twitter.com/EyeonTech_TT \nLike us on LinkedIn: https://www.linkedin.com/showcase/e"}, {"title": "Transformer models: Decoders", "video_id": "d_ixlCubqQw", "channel": "Hugging Face", "published_at": "2024-03-30T07:04:00Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "A general high-level introduction to the Decoder part of the Transformer architecture. What is it, when should you use it?\n\nThis video is part of the Hugging Face course: http://huggingface.co/course\n\nRelated videos:\n- The Transformer architectutre: https://youtu.be/H39Z_720T5s\n- Encoder models: https://youtu.be/MUqNwgPjJvQ\n- Encoder-Decoder models: https://youtu.be/0_4KEb08xrE\n\nTo understand what happens inside the Transformer network on a deeper level, we recommend the following blogposts by Jay Alammar:\n- The Illustrated Transformer: https://jalammar.github.io/illustrated-transformer/\n- The"}, {"title": "How to implement Perceptron from scratch with Python", "video_id": "aOEoxyA4uXU", "channel": "AssemblyAI", "published_at": "2024-03-30T07:00:26Z", "topic": "Deep Learning Frameworks (PyTorch/TensorFlow)", "embeddable": true, "description": "In the 8th lesson of the Machine Learning from Scratch course, we will learn how to implement the Perceptron algorithm.\n\nYou can find the code here: https://github.com/AssemblyAI-Examples/Machine-Learning-From-Scratch\n\nPrevious lesson: https://youtu.be/Rjr62b_h7S4\nNext lesson: https://youtu.be/T9UcK-TxQGw\n\nWelcome to the Machine Learning from Scratch course by AssemblyAI.\nThanks to libraries like Scikit-learn we can use most ML algorithms with a couple of lines of code. But knowing how these algorithms work inside is very important. Implementing them hands-on is a great way to achieve this. \n\n"}, {"title": "Perceptron | Neural Networks", "video_id": "OFbnpY_k7js", "channel": "First Principles of Computer Vision", "published_at": "2024-03-30T06:59:38Z", "topic": "Convolutional Neural Networks (CNNs)", "embeddable": true, "description": "First Principles of Computer Vision is a lecture series presented by Shree Nayar who is faculty in  the Computer Science Department, School of Engineering and Applied Sciences, Columbia University. Computer Vision is the enterprise of buildi  on Foundation Models (CRFM)\n\nTatsunori Hashimoto\nAssistant Professor of Computer Science\n\nView the entire course playlist: https://www.youtube.com/playlist?list=PLoROMvodv4rOY23Y0"}, {"title": "AI Memory Overview July 2025 - Where is AI Memory Today", "video_id": "z-37nL4ZHt0", "channel": "Engramic", "published_at": "2025-07-21T17:33:42Z", "topic": "AI Product Strategy", "embeddable": true, "description": "In this video, we provide a holistic view of the state of AI Memory. We discuss why AI Memory is important, why we need it, and what types of memory services are available in the marketplace.\n\n00:00 Intro\n01:26 Getting Past the Wall\n04:39 Why Do We Need Memory\n07:44 Expectations of A Genuine Conversation\n09:19 Working Memory\n12:41 Personalization\n13:36 Long-Term Memory - Memory Unit & Types\n16:59 Long-Term Memory - Deep Dive on Types\n18:04 Episodic\n20:33 Semantic/Graph\n21:40 Procedural\n23:18 Putting It All Together\n24:21 Ideas For Further Exploration\n25:45 AI Memory Vendors\n26:29 Outro"}, {"title": "LLM Agents MOOC | UC Berkeley CS294-196 Fall 2024 | LLM Agents: History & Overview by Shunyu Yao", "video_id": "RM6ZArd2nVc", "channel": "Berkeley RDI", "published_at": "2025-07-21T17:21:51Z", "topic": "Agent Frameworks & Orchestration (LangGraph/CrewAI/MCP)", "embeddable": true, "description": ""}, {"title": "Stanford CS224N NLP with Deep Learning | 2023 | Lecture 16 - Multimodal Deep Learning, Douwe Kiela", "video_id": "5vfIT5LOkR0", "channel": "Stanford Online", "published_at": "2025-07-21T16:57:27Z", "topic": "Vision-Language & Multimodal Models", "embeddable": false, "description": "For more information about Stanford's Artificial Intelligence professional and graduate programs, visit: https://stanford.io/ai\n\nTo learn more about this course, visit: https://online.stanford.edu/courses/c... \nTo follow along with the course schedule and syllabus, visit: http://web.stanford.edu/class/cs224n/ \n\nDouwe Kiela\nAdjunct Professor in Symbolic Syste 25-07-21T07:53:26Z", "topic": "LLM Alignment & RLHF (DPO)", "embeddable": true, "description": "Pod version: https://podcasters.spotify.com/pod/sh...\nSupport us! https://www.patreon.com/mlst \nMLST Discord: https://discord.gg/aNPkGUQtc5\n\nIn this video, Minqi Jiang (https://minch.co/), a research scientist at University College London & Meta AI, discusses the capabilities of language models like GPT-3 and the effects of Reinforcement Learning from Human Feedback (RLHF) on these models. He explains how RLHF helps make language models more user-friendly by providing a more reliable interface to specific parts of the model, but also reduces the diversity of their outputs, which might be less "}, {"title": "Knowledge Distillation with Llama 3.1 405B | Llama for Developers", "video_id": "kxx6TfpAkEU", "channel": "AI at Meta", "published_at": "2025-07-20T11:29:00Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "Download Llama models ➡️ https://go.fb.me/kbpn54\n\nIn this video, Hamid and Suraj explore the use of large language models (LLMs) for fine-tuning and synthetic data generation. The discussion includes insights on the importance of fine-tuning for adapting pre-trained models to specific domains or tasks, and how LLMs can be used to generate synthetic data that can augment existing datasets and improve model performance.\n\n### Timestamps\n00:00 Intro\n00:22 Importance of fine-tuning\n02:01 Curation of datasets\n03:43 Synthetic data\n13:30 Risks of model collapse?\n17:23 Distillation\n20:39 Real world app"}, {"title": "What every AI engineer needs to know about GPUs — Charles Frye, Modal", "video_id": "y-UGrYbJsJk", "channel": "AI Engineer", "published_at": "2025-07-20T10:59:01Z", "topic": "Hardware & Distributed Training", "embeddable": true, "description": "Every programmer needs to know a few things about hardware, like processors, memory, and disks. Due to AI systems' extreme demand for mathematical processing power, AI engineers need to know a few things about GPUs -- the world's most popular high-throughput mathematical co-processor.\n\nIn this talk, I will explain the fundamental engineering constraints and design decisions that shape GPUs and trace those up to some counter-intuitive facts about the performance characteristics of AI systems, with actionable insights for their deployers and consumers.\n\n\n---related links---"}, {"title": "Gemini 2.5: Pushing the Frontier with Advanced Reasoning, Multimodality, Long Context,Agentic", "video_id": "cUvG8VQ3kMc", "channel": "Xiaol.x", "published_at": "2025-07-20T07:11:09Z", "topic": "AI Agents", "embeddable": true, "description": "Gemini 2.5: Pushing the Frontier with Advanced Reasoning, Multimodality, Long Context, and Next Generation Agentic Capabilities\n\nGheorghe Comanici, Eric Bieber, Mike Schaekermann, Ice Pasupat, Noveen Sachdeva, Inderjit Dhillon, Marcel Blistein, Ori Ram, Dan Zhang, Evan Rosen, Luke Marris, Sam Petulla, Colin Gaffney, Asaf Aharoni, Nathan Lintz, Tiago Cardal Pais, Henrik Jacobsson, Idan Szpektor, Nan-Jiang Jiang, Krishna Haridasan, Ahmed Omran, Nikunj Saunshi, Dara Bahri, Gaurav Mishra, Eric Chu, Toby Boyd, Brad Hekman, Aaron Parisi, Chaoyi Zhang, Kornraphop Kawintiranon, Tania Bedrax-Weiss, Oli"}, {"title": "Compression of C(An Observation on Generalization - lya Sutskever)", "video_id": "YQOH10NFCjs", "channel": "Xiaol.x", "published_at": "2025-07-20T06:43:24Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "An Observation on Generalization\n\nlya Sutskever (OpenAI)\nLarge Language Models and Transformers\n\nhttps://www.youtube.com/watch?v=AKMuA_TVz3A\n\nIlya Sutskever presents **Kolmogorov complexity** as a foundational theoretical framework for understanding the mechanisms and success of unsupervised learning, aiming to provide a mathematical rigor akin to supervised learning. **Kolmogorov complexity (K(X))** is defined as **the length of the shortest computer program that can generate a given data set X**. This concept represents the **ultimate compressor** and, by extension, the **ultimate low regret"}, {"title": "How to Make Small Language Models Work. Yejin Choi Presents at Data + AI Summit 2024", "video_id": "OBkMbPpLCqw", "channel": "Databricks", "published_at": "2025-07-20T06:05:31Z", "topic": "LLM Reasoning & Test-Time Compute", "embeddable": true, "description": "Speaker: Yejin Choi, Professor and MacArthur Fellow at the University of Washington, and Senior Research Director for Commonsense AI at AI2"}, {"title": "Mixture of Experts for Realtime AI Applications | Founders Inc Tech Talk", "video_id": "bUH5tvIZInE", "channel": "Cerebras ", "published_at": "2025-07-20T05:52:40Z", "topic": "AI Product Strategy", "embeddable": true, "description": "Head Research Scientist Daria Soboleva presents at Founders Inc on how MoE models improve AI quality while reducing compute needs - critical for latency-sensitive applications where every millisecond counts."}, {"title": "Next-Gen AI - Multi-Agent LLMs and Policy Gradient RL Explained", "video_id": "YkyoJFmnaco", "channel": "GEN AI Super Storm", "published_at": "2025-07-20T05:50:43Z", "topic": "AI Agents", "embeddable": true, "description": "Ever wondered how the future of medical AI could look when powerful language models and reinforcement learning join forces?\n\nIn this hands-on Python project, we train an autonomous agent to diagnose patients by combining real-time advice from multiple LLM-powered medical experts (Internist, Specialist, and Generalist—each powered by Llama 3) with deep reinforcement learning.\n\nWhat you'll see:\n\nHow LLM agents “negotiate” on every patient case\n\nAttention-based neural policy networks making smart choices\n\nLive reward feedback and policy updates (REINFORCE)\n\nA real Python code walkthrough (Groq AP"}, {"title": "Search-R1: Training LLMs to Reason and Leverage Search Engines with Reinforcement Learning", "video_id": "CtohaKO4O1M", "channel": "Xiaol.x", "published_at": "2025-07-20T01:30:33Z", "topic": "LLM Reasoning & Test-Time Compute", "embeddable": true, "description": "Search-R1: Training LLMs to Reason and Leverage Search Engines with Reinforcement Learning\n\nBowen Jin, Hansi Zeng, Zhenrui Yue, Dong Wang, Hamed Zamani, Jiawei Han\nEfficiently acquiring external knowledge and up-to-date information is essential for effective reasoning and text generation in large language models (LLMs). Prompting advanced LLMs with reasoning capabilities during inference to use search engines is not optimal, since the LLM does not learn how to optimally interact with the search engine. This paper introduces Search-R1, an extension of the DeepSeek-R1 model where the LLM learns "}, {"title": "Mikael Brunila - Cosine Capital: Large Language Models and the Embedding of All Things", "video_id": "NhP8raTpZVs", "channel": "ERC project AIMODELS", "published_at": "2025-07-19T10:46:07Z", "topic": "Vision-Language & Multimodal Models", "embeddable": true, "description": "From the symposium \"Chat Token Vector: Questioning Models of Language and Neo-Structuralism in AI\", 11-13 June 2025, Venice, Aula Baratto.\n\nOrganized by ERC project AIMODELS (unive.it/aimodels)\nDepartment of Philosophy and Cultural Heritage, Ca’ Foscari University Venice\n_____________________________________________\n\nCosine Capital: Large Language Models and the Embedding of All Things\nMikael Brunila (McGill University Montreal) \n\nMy talk describes the emergence of a novel form of capital—which I call “cosine capital”—that finds objectified form in the so-called “embedding” structures of large"}, {"title": "How I use Claude Code (+ my best tips)", "video_id": "n7iT5r0Sl_Y", "channel": "Steve (Builder.io)", "published_at": "2025-07-18T19:12:41Z", "topic": "Prompt Engineering & In-Context Learning", "embeddable": true, "description": "Read the full list of tips: http://builder.io/blog/claude-code"}, {"title": "[UCLA RL-LLM] Chapter 0: Course outline and prologue", "video_id": "q9972BRoXzQ", "channel": "Ernest Ryu", "published_at": "2025-07-16T04:19:48Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "Chapter 0: Course outline and prologue\n\nCourse plan:\n - Chapter 0: Prologue\n - Chapter 1: Deep Reinforcement learning\n - Chapter 2: Large Language Models\n - Chapter 3: Reinforcement Learning of Large Language Models\n\nPrerequisite:\nStudents are expected to have basic familiarity with deep learning at the level of image classification. No prior experience with reinforcement learning (RL) or large language models (LLMs) is assumed. For the deep RL lectures, students should be familiar with conditional expectations and the tower property (law of total expectation).\n\nCourse URL:\nhttps://ernestryu.c"}, {"title": "Building Blocks for LLM Systems & Products: Eugene Yan", "video_id": "LzeC1AQ-U5o", "channel": "AI Engineer", "published_at": "2025-07-15T19:51:08Z", "topic": "AI Product Strategy", "embeddable": true, "description": "“There is a large class of problems that are easy to imagine and build demos for, but extremely hard to make products out of. For example, self-driving: It’s easy to demo a car self-driving around a block, but making it into a product takes a decade.” - Andrej Karpathy\n\nThis talk is about practical patterns for integrating large language models (LLMs) into systems and products. We’ll draw from academic research, industry resources, and practitioner know-how, and try to distill them into key ideas and practices. There are seven key patterns. I’ve also organized them along the spectrum of improv"}, {"title": "The Truth about AI is Devastating: Proof by MIT, Harvard", "video_id": "jxB-lQyAAxU", "channel": "Discover AI", "published_at": "2025-07-15T16:06:34Z", "topic": "AI Agents", "embeddable": true, "description": "AI Superintelligence? ASI with the new LLMs like GPT5, Gemini 3 or newly released Grok4? Forget about it! GROK4 will discover new Physics? Dream on. \n\nHarvard Univ and MIT provide new evidence of the internal thoughts and world models of every AI architecture from Transformer, to RNN to LSTM to Mamba and Mamba 2. \n\nLLMs are Just Faking It: New Proof by MIT, Harvard.\nHarvard & MIT's New Proof: LLMs Aren't Intelligent. Just pattern matching machines.\n\nThe truth about AI is devastating. And provides long and fascinating research trajectories into our future with AI. \n\n@harvard  @mit @OpenAI @goog"}, {"title": "Building Agentic Systems with Protocols: MCP & A2A", "video_id": "OE-15MWhA9U", "channel": "AI Makerspace", "published_at": "2025-07-15T15:00:16Z", "topic": "Agent Frameworks & Orchestration (LangGraph/CrewAI/MCP)", "embeddable": true, "description": "Discover how the new Agent-to-Agent (A2A) Protocol lets specialized AI agents find, message, and collaborate with each other—no brittle integrations required. In this live session, we’ll unpack A2A’s open-standard “operating system” for agent teamwork, show how it complements the Model Connector Protocol (MCP) “USB-C for LLMs,” and walk through real-world examples like a multi-agent travel planner. Perfect for AI engineers, platform architects, and anyone curious about interoperable agent ecosystems—tune in and see when to use A2A, MCP, or both to power your next-gen AI systems!"}, {"title": "Stanford CS336 Language Modeling from Scratch | Spring 2025 | Lecture 1: Overview and Tokenization", "video_id": "SQ3fZ1sAqXI", "channel": "Stanford Online", "published_at": "2025-07-15T06:55:24Z", "topic": "Neural Language Models (NLMs)", "embeddable": true, "description": "For more information about Stanford's online Artificial Intelligence programs visit: https://stanford.io/ai\n\nTo learn more about enrolling in this course visit: https://online.stanford.edu/courses/cs336-language-modeling-scratch\n\nTo follow along with the course schedule and syllabus visit: https://stanford-cs336.github.io/spring2025/\n\nPercy Liang\nAssociate Professor of Computer Science\nDirector of Center for Research on Foundation Models (CRFM)\n\nTatsunori Hashimoto\nAssistant Professor of Computer Science\n\nView the entire course playlist: https://www.youtube.com/playlist?list=PLoROMvodv4rOY23Y0"}, {"title": "Monte Carlo Tree Search (MCTS) Tutorial", "video_id": "Fbs4lnGLS8M", "channel": "Fullstack Academy", "published_at": "2025-07-15T06:42:21Z", "topic": "Reinforcement Learning", "embeddable": false, "description": "Learn more advanced front-end and full-stack development at: https://www.fullstackacademy.com\n\nThe Monte Carlo Tree Search (MCTS) is a search algorithm that an AI can use to make optimal decisions and reach its goals. Unlike minimax, the MCTS can work in very open-ended environments with a high branching factor, making it much more effective in games like Go, where the sheer amount of possibilities and choices are just too great for the brute force approach. It also does not require an evaluation function to determine the value of a game state, making it much more \"adaptable\" to different envi"}, {"title": "Why Context Engineering Is the Future of Building AI Agents?", "video_id": "9TTv9TehIT8", "channel": "Execute Automation", "published_at": "2025-07-15T06:12:09Z", "topic": "AI Agents", "embeddable": true, "description": "Prompt engineering is no longer enough. In this video, we dive into the rise of Context Engineering — the critical shift in how modern AI agents are built, reason, and scale. Learn how writing, selecting, compressing, and isolating context is transforming LLM-powered systems.\n\n🔍 Topics Covered:\n• What is Context Engineering?\n• How it differs from Prompt Engineering\n• Why it matters for agents, memory, and RAG\n• Real-world tools and architecture examples\n\nChapters:\n0:00 - Introduction\n041 - Prompt Engineering\n2:53 - Context Engineering\n5:33 - Problems with more Tokens \n6:36 - Drew's Post on Con"}, {"title": "How LLMs got better at reasoning", "video_id": "WtNpneVKNoY", "channel": "Rama Ramakrishnan", "published_at": "2025-07-14T17:46:43Z", "topic": "Research & Literature Review", "embeddable": true, "description": "PDF: https://www.dropbox.com/scl/fi/3p5o4t08eyatqe3cw25zf/How-LLMs-got-better-at-reasoning.pdf?rlkey=udcxyh1qy9jis35po0t8ww68p&dl=0"}, {"title": "Context Engineering: The Outer Loop | Hammad Bashir", "video_id": "vsfbplnJyA8", "channel": "Chroma", "published_at": "2025-07-14T17:16:10Z", "topic": "Prompt Engineering & In-Context Learning", "embeddable": true, "description": "In this talk, Chroma CTO Hammad Bashir explores the emerging discipline of context engineering: the craft (and maybe someday, science) of delivering the right context to language models to get consistent, high-quality outputs. Hammad dives into mental models—from interpolative databases to mesa optimizers—and break down common failure modes like context poisoning and distraction. Along the way, we look at lessons from structural engineering, CPUs, and autonomous vehicles to predict where the field is heading.\n\n--\n\nChroma is the open-source AI application database. Batteries included.\n\nEmbeddin"}, {"title": "LLM Post-Training: A Deep Dive into Reasoning Large Language Models", "video_id": "XCgWoLu-zK8", "channel": "Latent Space TV (see @LatentSpacePod for Pod)", "published_at": "2025-07-10T19:13:12Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "https://docs.google.com/presentation/d/1yrLFgEZHdr6XPNsW0g2o0uje3njN55fMlSmkABhtWs0/edit?usp=sharing"}, {"title": "Mathematics of LLMs in Everyday Language", "video_id": "1WHaFWMMXLI", "channel": "Turing", "published_at": "2025-07-10T07:01:32Z", "topic": "LLM Reasoning & Test-Time Compute", "embeddable": true, "description": "Explore science like never before - accessible, thrilling, and packed with awe-inspiring moments. Fuel your curiosity with 100s of free, curated STEM audio shows . \nDownload The Turing App on the Apple App Store, Google Play on (RAG)\n\n✅ Model Context Protocol (MCP)\n\n✅ RLHF (Reinforcement Learning with Human Feedback)\n\n✅ RLAIF (Re"}, {"title": "What is DeepSeek? [Technical Report Explained] | Multi-Head Latent Attention | Mixture of Experts", "video_id": "0sW-oWuHxX4", "channel": "FreeBirds Crew - Data Science and GenAI", "published_at": "2025-07-04T18:12:55Z", "topic": "LLM Reasoning & Test-Time Compute", "embeddable": true, "description": "DeepSeek Decoded: DeepSeek V3 or DeepSeek r1 is outperforming every LLM in the AI world with its Mixture-of-Experts (MoE) architecture, FP8 training, and Multi-Token Prediction (MTP), making it faster, cheaper, and more efficient than ever!\n\nIn this video, I break down DeepSeek V3’s architecture, how it beats OpenAI & Meta models, and why it’s a cost-effective LLM for AI development.\nFrom Multi-Head Latent Attention (MLA) to Auxiliary-Loss-Free Load Balancing, we cover all key innovations of DeepSeek V3 using insights from its research paper.\n\nResearch Paper: https://arxiv.org/html/2412.19437v"}, {"title": "LLM Post-Training: Reinforcement Learning, Scaling, and Fine-Tuning", "video_id": "bkotYVjsPMc", "channel": "KnowledgeDB AI", "published_at": "2025-07-04T09:50:40Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "Ref: https://arxiv.org/abs/2502.21321\n\n\n\n\n\n\nThis document provides a comprehensive survey of post-training methodologies for Large Language Models (LLMs), focusing on refining reasoning capabilities and aligning models with user preferences and ethical standards. \n\n\nIt categorizes these methodologies into fine-tuning, reinforcement learning (RL), and test-time scaling, while exploring the challenges and advancements in each area. The study highlights various techniques such as Proximal Policy Optimization (PPO), Direct Preference Optimization (DPO), and Group Relative Policy Optimization (GRPO"}, {"title": "LLM Unboxed", "video_id": "SDdmrHYf7PU", "channel": "Chris P AI", "published_at": "2025-07-03T22:45:44Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "Unlock the secrets of Large Language Models (LLMs)! 🤖 Ever wondered what really happens when you ask an AI a question? In this deep-dive podcast, we unbox the entire technical journey of an LLM query to response, based on comprehensive research.\n\nWe explore crucial steps like:\n\nQuery Submission & Client-Side Handling\nAPI Gateways, Authentication & Model Routing\nPrompt Engineering & Tokenization (the LLM's \"program\")\nCore LLM Inference (GPU/TPU, Attention Mechanisms, KV Cache)\nResponse Decoding, Sampling, Streaming & Safety Filters\nThe Operational Backbone: State Management, Monitoring, Securit"}, {"title": "Context Engineering for Agents", "video_id": "4GiqzUHD5AA", "channel": "LangChain", "published_at": "2025-07-03T22:43:10Z", "topic": "Agent Frameworks & Orchestration (LangGraph/CrewAI/MCP)", "embeddable": true, "description": "Agents need context (e.g., instructions, external knowledge, tool feedback) to perform tasks. Context engineering is the art and science of filling the context window with just the right information at each step of an agent’s trajectory. In this video, we break down some common strategies — write, select, compress, and isolate — for context engineering by reviewing various popular agents and papers. We then explain how LangGraph is designed to support them!\n\nBlog:\nhttps://blog.langchain.com/context-engineering-for-agents/\n\nVideo notes:\nhttps://mirror-feeling-d80.notion.site/Context-Engineering"}, {"title": "An Image Is Worth 16x16 Words - Paper Explained", "video_id": "G7i330EJAfU", "channel": "Halfling Wizard", "published_at": "2025-07-03T17:13:57Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "In this video, I explain the paper “an image is worth 16x16 words” in which Vision Transformer is Introduced. \nI first describe one of the biggest flaws in attention mechanism; which is the fact that it is computation-hungry. Then I show you how the authors of this paper got around this difficulty. We learn about Vision Transformer, a large model that can be fine-tuned for a variety of computer vision tasks; and observed that, given enough data, vision transformer outperforms CNNs.\n\n📑 Chapters:\n0:00 Abstract\n0:19 Introduction\n2:27 Related Works\n2:48 Method\n5:06 Results\n6:17 Conclusion\n\n📝 Link "}, {"title": "Building intelligent agents with Gemma 3", "video_id": "16gVylZniJE", "channel": "Google for Developers", "published_at": "2025-07-02T16:15:51Z", "topic": "AI Agents", "embeddable": true, "description": "Explore the development of intelligent agents using Gemma models, with core components that facilitate agent creation, including capabilities for function calling, planning, and reasoning. \n\nSubscribe to Google for Developers → https://goo.gle/developers \n\nSpeakers: Kathleen Kenealy \nProducts Mentioned: Gemma"}, {"title": "Instruction Fine-Tuning and In-Context Learning of LLM (w/ Symbols)", "video_id": "-SeGfpu3hn0", "channel": "Discover AI", "published_at": "2025-07-02T11:35:32Z", "topic": "Prompt Engineering & In-Context Learning", "embeddable": true, "description": "New insights in \"Instruction Fine-Tuning\" and \"In-Context Learning\" of LLM: The evolution to \"Symbol Fine Tuning\" of LLMs. From FLAN-PaLM 8B to FLAN-PaLM 540B models.\n\nThis video summarizes four scientific pre-prints on Instruction fine-tuning LLM and prompt engineering (ICL in-context learning) of Large Language Models (LLMS):\n\nIn-Context Retrieval-Augmented Language Models\nOri Ram Yoav Levine Itay Dalmedigos Dor Muhlgay Amnon Shashua Kevin Leyton-Brown Yoav Shoham by AI21 Labs\nhttps://arxiv.org/abs/2302.00083\n\nWhat learning algorithm is in-context learning? Investigations with linear models\n"}, {"title": "The CORRECT way to use ChatGPT (in 2026)", "video_id": "p3840QxlYzc", "channel": "Jeff Su", "published_at": "2025-07-01T18:48:14Z", "topic": "LLM Alignment & RLHF (DPO)", "embeddable": true, "description": "🌟 Start learning with Coursera today: https://imp.i384100.net/c/2464514/3058290/14726\n\n#ChatGPT releases over 1.1 updates weekly, but most explanations are filled with meaningless jargon. This video cuts through the noise with real-world examples showing exactly when to use reasoning models vs chat models, ChatGPT search vs Google, Deep Research, and Canvas! \n\n*TIMESTAMPS*\n00:00 The most important ChatGPT features\n00:24 Choosing the right ChatGPT model\n03:11 How I learn AI\n04:05 When to use ChatGPT web search\n05:52 How to use ChatGPT Deep Research\n07:45 When to enable Canvas in ChatGPT\n09:09 P"}, {"title": "Matrix Multiplication Concept Explained", "video_id": "VXG6WzS-Xb4", "channel": "Machine Learning Studio", "published_at": "2025-06-30T09:27:54Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "In this video, I give a recap of matrix multiplication, and cover a few linear algebra concepts involving vectors and matrices along the way, such as Transpose, Dot Product.\n\nIn the next video, I will explain the attention mechanism. \nLink to next video for Self-Attention using Scaled-Dot-Product Attention: https://youtu.be/1IKrHh2X0F0"}, {"title": "Deep dive - Better Attention layers for Transformer models", "video_id": "2TT384U4vQg", "channel": "Julien Simon", "published_at": "2025-06-30T09:27:31Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "The self-attention mechanism is at the core of transformer models. As amazing as it is, it requires a significant amount of computing and memory bandwidth, leading to scalability issues as models get more complex and context length increases.\n\nIn this video, we'll quickly review the computation involved in the self-attention mechanism and its multi-head variant. Then, we'll discuss newer attention implementations focused on compute and memory optimizations, namely Multi-Query Attention, Group-Query Attention, Sliding Window Attention, Flash Attention v1 and v2, and Paged Attention.\n\nSlides: ht"}, {"title": "Context Engineering: What It Is and Why It Matters", "video_id": "fYgsZnkFeck", "channel": "The AI Daily Brief: Artificial Intelligence News", "published_at": "2025-06-29T15:14:07Z", "topic": "Prompt Engineering & In-Context Learning", "embeddable": true, "description": "Context engineering quickly becomes a core skill for anyone working with large language models (LLMs) and AI agents. Unlike prompt engineering, which is about crafting single questions or requests, context engineering focuses on providing the right background, files, and environment so LLMs can solve your task.\n\nSources:\nhttps://cognition.ai/blog/dont-build-multi-agents\nhttps://blog.langchain.com/the-rise-of-context-engineering/\nhttps://rlancemartin.github.io/2025/06/23/context_engineering/\n\n\nBrought to you by:\nKPMG – Go to ⁠www.kpmg.us/ai⁠ to learn more about how KPMG can help you drive value"}, {"title": "nanoAhaMoment: RL for LLM from Scratch with 1 GPU - Part 1", "video_id": "ZMO5tv30ri8", "channel": "Amirhossein Kazemnejad", "published_at": "2025-06-29T14:46:14Z", "topic": "Hardware & Distributed Training", "embeddable": true, "description": "In this video, Amirhossein Kazemnejad and Milad Aghajohari, researchers at Mila, walk you through a complete, efficient, single-GPU recreation of the DeepSeek R1-Zero training pipeline: all in a single Notebook/Python file, without relying on external training libraries.\n\nGitHub Link: https://github.com/McGill-NLP/nano-aha-moment\nPart 2: https://www.youtube.com/watch?v=dxhCyhc_bcQ\nMy Co-host Milad Aghajohari: https://miladink.github.io\n\nYou will learn:\n- How to train a 3B parameter base model from scratch using GRPO \n- How to reproduce the famous “Aha” moments seen in reasoning-focused models "}, {"title": "In-Context Learning: A Case Study of Simple Function Classes", "video_id": "DiJsg93zQDc", "channel": "Simons Institute for the Theory of Computing", "published_at": "2025-06-29T08:54:01Z", "topic": "Prompt Engineering & In-Context Learning", "embeddable": true, "description": "Gregory Valiant (Stanford University)\n\nhttps://simons.berkeley.edu/talks/gregory-valiant-stanford-university-2023-08-18\n\nLarge Language Models and Transformers\n\nIn-context learning refers to the ability of a model to learn new tasks from a sequence of input-output pairs given in a prompt. Crucially, this learning happens at inference time without any parameter updates to the model. I will discuss our empirical efforts that shed light on some basic aspects of in-context learning: To what extent can Transformers, or other models such as LSTMs be efficiently trained to in-context learn fundamenta"}, {"title": "Why MCP really is a big deal | Model Context Protocol with Tim Berglund", "video_id": "FLpS7OfD5-s", "channel": "Confluent Developer", "published_at": "2025-06-29T08:41:30Z", "topic": "Agent Frameworks & Orchestration (LangGraph/CrewAI/MCP)", "embeddable": true, "description": "Blog: https://www.confluent.io/blog/ai-agents-using-anthropic-mcp | Tim Berglund is back at the lightboard with *MCP* (Model Context Protocol). MCP really _is_ a big deal, but most people are missing the point. It's not just about enhancing desktop applications with agentic functionality—it's about exposing reusable tools and resources (including real-time data from sources like Apache Kafka) to build _agentic microservices._ Doing this takes us beyond basic LLM chatbots to dynamic, problem-solving systems that deliver real value in real professional settings.\n\nLEARN MORE\n► Blog: Powering AI A"}, {"title": "GPT-3: Language Models are Few-Shot Learners (Paper Explained)", "video_id": "SY5PvZrJhLE", "channel": "Yannic Kilcher", "published_at": "2025-06-29T06:24:32Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "#gpt3 #openai #gpt-3\n\nHow far can you go with ONLY language modeling? Can a large enough language model perform NLP task out of the box? OpenAI take on these and other questions by training a transformer that is an order of magnitude larger than anything that has ever been built before and the results are astounding.\n\nOUTLINE:\n0:00 - Intro & Overview\n1:20 - Language Models\n2:45 - Language Modeling Datasets\n3:20 - Model Size\n5:35 - Transformer Models\n7:25 - Fine Tuning\n10:15 - In-Context Learning\n17:15 - Start of Experimental Results\n19:10 - Question Answering\n23:10 - What I think is happening\n"}, {"title": "On the Opportunities and Risks of Foundation Models (intro)", "video_id": "ZshcPdavsdU", "channel": "Samuel Albanie", "published_at": "2025-06-29T06:11:53Z", "topic": "LLM Reasoning & Test-Time Compute", "embeddable": true, "description": "This video provides a slow description of the introduction to the report \"On the Opportunities and Risks of Foundation Models\" by R. Bommasani et al., shared on arxiv in August 2021.\n\nTimestamps:\n00:00 - On the Opportunities and Risks of Foundation Models\n01:07 - Outline\n01:58 - What is a foundation model?\n04:31 - Emergence and homogenisation\n07:01 - Foundation models - origin story\n09:44 - Foundation models - NLP developments\n12:08 - Foundation models - homogenisation\n13:52 - Foundation models - risks and naming\n17:43 - Social impact\n21:06 - Ecosystem\n24:24 - Think ecosystem, act model\n25:46 "}, {"title": "Mixture of Experts LLM - MoE explained in simple terms", "video_id": "NrCjFbBy_vs", "channel": "Discover AI", "published_at": "2025-06-27T07:21:15Z", "topic": "Prompt Engineering & In-Context Learning", "embeddable": true, "description": "Mixture of Experts - MoE explained in simple terms with three easy examples. \nYou can test Mixtral 8x7B through this link (sign-in required, beta version only, beware): \nhttps://app.fireworks.ai/models/fireworks/mixtral-8x7b\n\nGPT-4 generated text:\nThe video transcript provides a comprehensive overview of the development and optimization of mixture of experts (MoE) systems in the context of Large Language Models (LLMs). The presenter begins by introducing the concept of MoE as a framework for decomposing LLMs into smaller, specialized systems that focus on distinct aspects of input data. This a"}, {"title": "How to Efficiently Serve an LLM?", "video_id": "VM9KPBBBizw", "channel": "Ahmed Tremo", "published_at": "2025-06-27T07:20:46Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "How to Efficiently Serve an LLM\n\nLarge Language Models (LLMs) have become crucial due to their performance, but their size poses significant serving challenges. This video covers strategies to optimize LLM serving systems for better efficiency.\n\nKey Steps in LLM Inference:\n1. Request Handling: Users send requests via HTTPs/gRPC, which the LLM server schedules based on Quality of Experience (QoE) metrics: \n   - TTFT (Time to First Token)\n   - TDS (Token Delivery Speed)\n\n2. Inference Phases:\n   - Prefill Phase: Processes input tokens in parallel to generate the KV Cache, utilizing GPU's parallel"}, {"title": "What are AI Agents.  Let's build one", "video_id": "qsO5jVrzoas", "channel": "Hitesh Choudhary", "published_at": "2025-06-27T06:15:41Z", "topic": "AI Agents", "embeddable": true, "description": "Welcome to a youtube channel dedicated to programming and coding related tutorials. We talk about tech, write code, discuss about cloud and devops. That’s what we do all day, all year.\n\nGet all source code for react application:\nhttps://github.com/hiteshchoudhary/react-english\n\nAll source code is available at my Github account:\n\nhttps://github.com/hiteshchoudhary\n\nOur Open-Source Project is here: https://freeapi.app\n\nJoin me at whatsapp: https://hitesh.ai/whatsapp\n\nfor community discord: https://hitesh.ai/discord\n\nInstagram pe yaha paaye jaate h:\nhttps://www.instagram.com/hiteshchoudharyoffici"}, {"title": "Local open-source LLM better than DeepSeek? Gemma 3 deep dive", "video_id": "LQnqxbR74Hw", "channel": "thelionai", "published_at": "2025-06-27T05:25:58Z", "topic": "LLM Reasoning & Test-Time Compute", "embeddable": true, "description": "Dive deep into Google's latest open-source language model with our comprehensive Gemma 3 video! We'll explore:\n\n✅ Gemma 3's benchmarks: How does it stack up against DeepSeek and other models?\n✅ Architecture innovations: Uncover the cutting-edge techniques behind its performance.\n✅ Training methods: Learn how Google optimized this model for amazing results.\n✅ Usage and applications: Discover how to run Gemma 3 and use it for your projects.\n\nGemma 3 is a powerful new contender in the open-source AI landscape, and this video is your key to understanding it! Don't forget to like, subscribe, and le"}, {"title": "[EEML'24] Jovana Mitrović - Vision Language Models", "video_id": "rUQUv4u7jFs", "channel": "EEML Community", "published_at": "2025-06-23T20:36:06Z", "topic": "Vision-Language & Multimodal Models", "embeddable": true, "description": ""}, {"title": "Flash Attention Machine Learning", "video_id": "N1EZpa7lZc8", "channel": "Stephen Blum", "published_at": "2025-06-23T17:27:36Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "Flash attention aims to boost the performance of language models and transformers by creating an efficient pipeline to transform matrices and data. Sounds complicated, right? The concept is to streamline the merger of various mathematical equations into one step, making it faster.\n\nThis process computes all mathematical units through one GPU pass and doesn't require shifting memory around. In other words, it's all done at once. This approach, called Flash Attention, isn't an entirely new technology but rather a practical innovation that makes the algorithms more efficient by creating a single "}, {"title": "Generate Text Embeddings Locally for Vector Search Databases", "video_id": "v05XKEy-2Q4", "channel": "Stephen Blum", "published_at": "2025-06-23T16:42:23Z", "topic": "Retrieval-Augmented Generation (RAG) & Vector Search", "embeddable": true, "description": "Looking to build next-gen tech with embeddings and vector searches? You have options to sift through your company's data or assorted databases. Sure, you could use an API with a cost, but instead, why not generate the embeddings yourself?\n\nOpen AI and other vendors offer APIs, but open-source alternatives exist, too. For example, huggingface.co has a range of embedding models. These models convert any sequence of texts into vectors, creating a database.\n\nThis allows for indexing documents and enables a more efficient similarity search than a full text search. Conventional full text search inde"}, {"title": "RFT, DPO, SFT: Fine-tuning with OpenAI — Ilan Bigio, OpenAI", "video_id": "JfaLQqfXqPA", "channel": "AI Engineer", "published_at": "2025-06-23T16:26:24Z", "topic": "Fine-Tuning & PEFT (LoRA/QLoRA)", "embeddable": true, "description": "Full workshop covering all forms of fine-tuning and prompt engineering, like SFT, DPO, RFT, prompt engineering / optimization, and agent scaffolding.\n\nAbout Ilan Bigio\nIlan Bigio is a founding member of OpenAI’s Developer Experience team where he explores model capabilities, builds demos and developer tools, and shares his learnings through talks and docs.\n\nHis work includes creating the AI phone ordering demo showcased at DevDay 2024, leading technical development for Swarm, the precursor to the Agents SDK, and contributing to Codex CLI. Prior to that, he was a Solutions Architect at OpenAI, "}, {"title": "HuggingFace Transformer Pipelines: Language, Vision, Audio, Multi-Modal", "video_id": "nEMVfvc12Xk", "channel": "Hands-on AI ", "published_at": "2025-06-23T07:33:14Z", "topic": "Vision-Language & Multimodal Models", "embeddable": true, "description": "Code:  https://github.com/KannamSridharKumar/HuggingFace_Transformers_Pipelines\nCo ey.edu/talks/yasaman-bahri-stanford-university-2023-08-15\nLarge Language Models and Transformers"}, {"title": "Build an LLM from Scratch 3: Coding attention mechanisms", "video_id": "-Ll8DtpNtvk", "channel": "Sebastian Raschka", "published_at": "2025-05-18T17:18:09Z", "topic": "Prompt Engineering & In-Context Learning", "embeddable": true, "description": "Links to the book: \n- https://amzn.to/4fqvn0D (Amazon)\n- https://mng.bz/M96o (Manning)\n\nLink to the GitHub repository: https://github.com/rasbt/LLMs-from-scratch\n\nThis is a supplementary video explaining how attention mechanisms (self-attention, causal attention, multi-head attention) work by coding them from scratch.\n\n00:00 3.3.1 A simple self-attention mechanism without trainable weights\n41:01 3.3.2 Computing attention weights for all input tokens\n52:40 3.4.1 Computing the attention weights step by step\n1:12:33 3.4.2 Implementing a compact SelfAttention class\n1:21:00 3.5.1 Applying a causal "}, {"title": "LLMs for Everything and Everyone! - Sebastian Raschka - Lightning AI", "video_id": "B1RSE73RdRE", "channel": "Optimized AI Conference", "published_at": "2025-05-18T17:13:34Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "In this conference talk, titled \"LLMs for Everything and Everyone!\" presented by Sebastian Raschka, who is the Lead AI Educator at Lightning AI, you will get an approachable view into the world of Large Language Models (LLMs). LLMs, like GPT-3.5, have revolutionized various fields of artificial intelligence, and Sebastian highlights their versatility and widespread applicability, in addition to addressing the small vs. big model debate.\n\nYou will gain insights into the practical uses of LLMs in diverse scenarios, discovering how these models can be harnessed to tackle complex problems and stre"}, {"title": "Improving LLM accuracy with Monte Carlo Tree Search", "video_id": "mfAV_bigdRA", "channel": "Trelis Research", "published_at": "2025-05-18T16:44:43Z", "topic": "Fine-Tuning & PEFT (LoRA/QLoRA)", "embeddable": true, "description": "➡️ Get Life-time Access to the ADVANCED-inference Repo (incl. notebooks in this vid.): https://trelis.com/enterprise-server-api-and-inference-guide/\n➡️ Trelis Newsletter: https://blog.Trelis.com\n➡️ Trelis Resources and Support: https://Trelis.com/About\n\nVIDEO RESOURCES:\n- Slides: https://docs.google.com/presentation/d/1K7sGEv-AIOWR0OcXTd6SAXKgxgczOABb35z3XNc3b8I/edit?usp=sharing\n- Paper: https://arxiv.org/abs/2406.07394 (Accessing GPT-4 level Mathematical Olympiad Solutions via Monte Carlo Tree Self-refine with LLaMa-3 8B)\n- Code from Paper: https://github.com/trotsky1997/MathBlackBox\n\nTIMESTA"}, {"title": "How LLMs Learn to Reason [GRPO]", "video_id": "mg-iU-WxiNs", "channel": "Jia-Bin Huang", "published_at": "2025-05-18T06:01:08Z", "topic": "Reinforcement Learning", "embeddable": true, "description": "Reinforcement learning algorithms are the key driving force for training reasoning LLMs (e.g., DeepSeek-R1, Google's Gemini pro, OpenAI's o1/o3).\n\nThis video provides an overview of the key ideas of these reinforcement learning algorithms, covering the development from REINFORCE, Value function estimation, Actor-critic methods, Generalized Advantage Estimation, TRPO, PPO, and GRPO.\n\n00:00 Introduction\n00:43 Notation\n02:41 Policy gradient\n05:11 Decomposing trajectory into states and actions\n07:05 Baseline subtraction\n07:58 Value function estimation\n08:31 Advantage estimation \n11:11 Actor-critic"}, {"title": "A Fun & Absurd Introduction to Vector Databases • Alexander Chatzizacharias • GOTO 2024", "video_id": "5hAGhmHNTQQ", "channel": "GOTO Conferences", "published_at": "2025-05-17T04:37:09Z", "topic": "Retrieval-Augmented Generation (RAG) & Vector Search", "embeddable": true, "description": "This presentation was recorded at GOTO Amsterdam 2024. #GOTOcon #GOTOams\nhttps://gotoams.nl\n\nAlexander Chatzizacharias - Software Engineer at JDriven\n\nRE : "Pft04KLw5Lk", "channel": "SUPERWISE®", "published_at": "2025-05-15T19:02:01Z", "topic": "Prompt Engineering & In-Context Learning", "embeddable": true, "description": "Everything from training models from scratch and fine-tuning open-source models to using hosted APIs, with a particular emphasis on the design pattern of in-context learning.\nKey topics we'll cover during the session include:\n- Data preprocessing and embedding, focusing on the role of contextual data, embeddings, and vector databases in creating effective LLM applications.\n- Strategies for prompt construction and retrieval, which are becoming increasingly complex and critical for product differentiation.\n- Prompt execution and inference, analyzing the leading language model providers, their mo"}, {"title": "101 ways to solve search (by Pratik Bhavsar)", "video_id": "VHm6_uC4vxM", "channel": "Elvis Saravia", "published_at": "2025-05-15T18:15:58Z", "topic": "Research & Literature Review", "embeddable": true, "description": "◾  Slides: http://bit.ly/all-about-search\n\n◾  Abstract\n\nSearch is one of the most used applications of NLP and has evolved tremendously with time. Search can be solved in many ways - supervised Vs unsupervised, classical Vs deep learning. Search engines are easy to start with but difficult to improve. In this talk, we will discuss different ways to build search and touch on the below topics:\n\n◾ What is search?\n◾ Elasticsearch\n◾ Elasticsearch+Query augmentation\n◾ Semantic search\n◾ Hybrid search\n◾ Multilingual search\n◾ Learning to rank\n◾ Large scale problems with search\n◾ COVID search engine app"}, {"title": "TEST TIME Optimized AI REASONING (MIT)", "video_id": "3ea2O7qfPjo", "channel": "Discover AI", "published_at": "2025-05-15T16:26:57Z", "topic": "LLM Reasoning & Test-Time Compute", "embeddable": false, "description": "Optimized Test-Time Training by @mit : Shaping AI’s Future in Reasoning.\n\nThis brilliant video introduces a novel approach to improving reasoning capabilities in large language models (LLMs) through Test-Time Training (TTT) with a Leave-One-Out (LOO) strategy, specifically applied to the Abstraction and Reasoning Corpus (ARC). ARC tasks require abstract pattern recognition and rule inference, often with only a few input-output examples. TTT addresses this by dynamically fine-tuning lightweight Low-Rank Adapters (LoRA) at inference time. \n\nThe method deconstructs the main task into independent "}, {"title": "Jay Alammar on LLMs, RAG, and AI Engineering", "video_id": "KMSa5CccEEQ", "channel": "Machine Learning Street Talk", "published_at": "2025-05-15T08:13:34Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "Jay Alammar, renowned AI educator and researcher at Cohere, discusses the latest developments in large language models (LLMs) and their applications in industry. Jay shares his expertise on retrieval augmented generation (RAG), semantic search, and the future of AI architectures.\n\nMLST is sponsored by Brave:\nThe Brave Search API covers over 20 billion webpages, built from scratch without Big Tech biases or the recent extortionate price hikes on search API access. Perfect for AI model training and retrieval augmentated generation. Try it now - get 2,000 free queries monthly at http://brave.com/"}, {"title": "DeepSeek R1 Coldstart: How to TRAIN a 1.5B Model to REASON", "video_id": "Pabqg33sUrg", "channel": "Chris Hay", "published_at": "2025-05-14T18:38:40Z", "topic": "LLM Reasoning & Test-Time Compute", "embeddable": true, "description": "Curious how a 1.5B parameter model can solve maths problems better than far larger models? In this video, I demonstrate how DeepSeek R1 leverages lengthy chains of thought to enhance its mathematical reasoning. We take a close look at how DeepSeek R1 prompts are structured and generated according to the R1 paper—then reproduce these chain of thought prompts via the DeepSeek R1 coldstart method and my own maths compiler to create synthetic training data.\n\nI then walk through the entire fine-tuning process, step by step, showing how even a relatively modest model can outperform bulkier rivals us"}, {"title": "AI Agents for Business Efficiency: What Should They Do for Your Business? A Leader's Guide to Unlock", "video_id": "2sbkKGI6RTM", "channel": "Ragnar Pitla (Microsoft | Rbuild.ai)", "published_at": "2025-05-14T18:08:42Z", "topic": "AI Agents", "embeddable": true, "description": "In the era of AI, the question isn’t just what these AI agents can do but rather, what should they do for you? \nIn this video, I aim to empower leaders to think strategically about AI adoption and lead with purpose.\n\nJoin me, Ragnar Pitla, as we explore the evolution of AI agents from basic bots to powerful digital teammates. \nFollow me on Linkedin: https://www.linkedin.com/in/ragnarpitla/\nWe’ll break down what AI agents are, how they work, and most importantly, how they can be leveraged to help you achieve your business goals. I cover real-world examples from Microsoft and beyond to illustrat"}, {"title": "What is Agentic AI? Society of AI Agents with Agentic AI framework Magentic-One (Autogen)", "video_id": "dw977hx_KAs", "channel": "Ragnar Pitla (Microsoft | Rbuild.ai)", "published_at": "2025-05-14T18:05:21Z", "topic": "AI Agents", "embeddable": true, "description": "Thanks for Watching, appreciate your time: Please follow me on Linkedin and watch  https://www.youtube.com/watch?v=AdsXyFxo7sU - RAG is last video, where we uncover how RAG empowers AI with real-time, accurate, and dynamic responses!\n\nWhat is Agentic AI? Discover the Future of AI Systems Inspired by the Society of Mind\n\nHave you ever wondered why we need multiple AI agents instead of a single, all-encompassing system? In this video, we explore the groundbreaking concept of Agentic AI—a framework where specialized agents collaborate to tackle complex tasks, inspired by Marvin Minsky’s visionary"}, {"title": "Scaling Laws for Large Language Models", "video_id": "NvgNI3waAy4", "channel": "Rajistics - data science, AI, and machine learning", "published_at": "2025-05-14T17:26:51Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "Scaling laws help us figure out how to manage the amount of training data versus the model size. DeepMind showed Chinchilla by using more data, you can use a smaller model. This went against the known wisdom from OpenAI’s research. This is a big deal because lots of resources are spent on building those models. Ask more questions in the comments. #datascience #machinelearning #largelanguagemodels #openai #deepmind #nvidia #microsoft #azure #huggingface #chatgpt\n━━━━━━━━━━━━━━━━━━━━━━━━━\n★ Rajistics Social Media » \n● Link Tree: https://linktr.ee/rajistics\n● LinkedIn: https://www.linkedin.com/in"}, {"title": "WHY AND HOW OF SCALING LARGE LANGUAGE MODELS | NICHOLAS JOSEPH", "video_id": "qscouq3lo0s", "channel": "PyTorch", "published_at": "2025-05-14T15:48:22Z", "topic": "LLM Reasoning & Test-Time Compute", "embeddable": true, "description": "Anthropic is an AI safety and research company that’s working to build reliable, interpretable, and steerable AI systems. Over the past decade, the amount of compute used for the largest training runs has increased at an exponential pace. We've also seen in many domains that larger models are able to attain better performance following precise scaling laws. The compute needed to train these models can only be attained using many coordinated machines that are communicating data between them. In this talk, Nicholas Joseph (Technical Staff, Anthropic) goes through why and how they can scale up tr"}, {"title": "Stanford CS25: V4 I Aligning Open Language Models", "video_id": "AdLgPmcrXwQ", "channel": "Stanford Online", "published_at": "2025-05-14T14:50:59Z", "topic": "LLM Alignment & RLHF (DPO)", "embeddable": true, "description": "April 18, 2024\nSpeaker: Nathan Lambert, Allen Institute for AI (AI2)\n\nAligning Open Language Models\nSince the emergence of ChatGPT there has been an explosion of methods and models attempting to make open language models easier to use. This talk retells the major chapters in the evolution of open chat, instruct, and aligned models, covering the most important techniques, datasets, and models. Alpaca, QLoRA, DPO, PPO, and everything in between will be covered. The talk will conclude with predictions and expectations for the future of aligning open language models. Slides posted here: https://do"}, {"title": "Language Modeling: A Tutorial on Data Preparation, Model Training, and Adaptation", "video_id": "qPzZeP7t5ZQ", "channel": "DSAI by Dr. Osbert Tay", "published_at": "2025-05-13T20:40:05Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "Opening the Language Model Pipeline: A Tutorial on Data Preparation, Model Training, and Adaptation\nKyle Lo · Akshita Bhagia · Nathan Lambert\n\nIf you would like to support the channel, please join the membership:\nhttps://www.youtube.com/c/AIPursuit/join\n\nSubscribe to the channel:\nhttps://www.youtube.com/c/AIPursuit?sub_confirmation=1\n\nThe video is reposted for educational purposes and encourages involvement in the field of AI research.\nSource: https://neurips.cc/virtual/2024/tutorial/99526"}, {"title": "How language model post-training is done today", "video_id": "6yIMb0K-aS4", "channel": "Interconnects AI", "published_at": "2025-05-13T20:00:56Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "I’m far more optimistic about the state of open recipes for and knowledge of post-training starting 2025 than I was starting 2024. Last year one of my first posts was how open post-training won’t match like likes of GPT-4. This is still the case, but now we at least understand the scope of things we will be working with better.\n\nIt’s a good time to record an overview of what post-training looks like today. I gave a version of this talk for the first time in 2023, which felt like a review of the InstructGPT paper not based on reproduced literature knowledge. In 2024, the scientific community ma"}, {"title": "Reasoning Models in Generative AI: How the Next Generation of LLMs Can Think", "video_id": "DZWEbG6t-K4", "channel": "UofILibrary", "published_at": "2025-05-13T16:34:13Z", "topic": "LLM Reasoning & Test-Time Compute", "embeddable": true, "description": "Presenter: Dr. Luke Sheneman - Head, Research Computing and Data Services\nPresented: 04/18/2025\n\nThe latest frontier \"thinking models\" can apparently begin to match the reasoning performance of humans. We will do a technical deep dive on the likely underpinnings of the latest generation of frontier reasoning models, including OpenAI's o1 and o3. We will discuss and implement in Python a simple LLM that uses self-taught reasoning (STR) and Q-learning at both training and inference."}, {"title": "Stanford CS25: V5 I The Advent of AGI, Div Garg", "video_id": "nEHNwdrbfGA", "channel": "Stanford Online", "published_at": "2025-05-13T15:55:21Z", "topic": "AI Agents", "embeddable": false, "description": "April 15, 2025\n\nAs superintelligence seems round the corner and frontier models continue to scale, a new wave of autonomous AI agents is emerging—systems capable of perceiving, reasoning, and acting in open-ended environments. These agents represent the first steps toward Artificial General Intelligence, promising to radically reshape how we interface with software and get things done in the world.\nBut the path to AGI is riddled with deep, unsolved challenges: brittle reasoning, drifting goals, shallow memory, and poor calibration under uncertainty. Real-world deployment quickly reveals how fr"}, {"title": "Distributed ML Talk @ UC Berkeley", "video_id": "9TwTKt50ZG8", "channel": "Sourish Kundu", "published_at": "2025-05-13T10:04:02Z", "topic": "Hardware & Distributed Training", "embeddable": true, "description": with Deep Learning | Spring 2022 | Guest Lecture: Scaling Language Models", "video_id": "UFem7xa3Q2Q", "channel": "Stanford Online", "published_at": "2025-05-13T05:54:20Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": false, "description": "For more information about Stanford's Artificial Intelligence professional and graduate programs visit: https://stanford.io/3w46jar\n\nTo learn more about this course visit: https://online.stanford.edu/courses/cs224n-natural-language-processing-deep-learning  \nTo follow along with the course schedule and syllabus visit: http://web.stanford.edu/class/cs224n/ \n\nJared Kaplan\nAssociate Professor, Department of Physics & Astronomy\nBloomberg Center for Physics and Astronomy, Johns Hopkins University\n\nProfessor Christopher Manning\nThomas M. Siebel Professor in Machine Learning, Professor of Linguistics"}, {"title": "LLMs | Scaling Laws | Lec 11", "video_id": "S7GOt85DWBs", "channel": "LCS2", "published_at": "2025-05-12T07:54:27Z", "topic": "Research & Literature Review", "embeddable": true, "description": "tl;dr: This lecture provides an in-depth discussion on the scaling laws governing the performance and emergent abilities of LLMs, offering insights into both the empirical evidence and the ongoing debates about the nature of these abilities in the field of AI research.\n\n🎓 Lecturer: Sourish Dasgupta [https://daiict.ac.in/faculty/sourish-dasgupta]\n🔗 Get the Slides Here: http://lcs2.in/llm2401\n📚 Suggested Readings: \n- Scaling Laws for Neural Language Models [https://arxiv.org/pdf/2001.08361]\n- Emergent Abilities of Large Language Models [https://arxiv.org/pdf/2206.07682]\n- Training Compute-Optima"}, {"title": "Colin Raffel: Exploring the Limits of Transfer Learning with a Unified Text-to-Text Transformer", "video_id": "eKqWC577WlI", "channel": "Ai2", "published_at": "2025-05-12T07:35:13Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "Transfer learning, where a model is first pre-trained on a data-rich task before being fine-tuned on a downstream task, has emerged as a powerful technique in natural language processing (NLP). The effectiveness of transfer learning has given rise to a diversity of approaches, methodology, and practice. In this talk, I will discuss our recent paper where we explored the landscape of transfer learning techniques for NLP by introducing a unified framework that converts every language problem into a text-to-text format. Our systematic study compared pre-training objectives, architectures, unlabel"}, {"title": "Give Me 28 Minutes and I'll Completely Change the Way You Build AI Agents", "video_id": "TV8SyEuSMIA", "channel": "Cole Medin", "published_at": "2025-05-12T04:45:34Z", "topic": "AI Agents", "embeddable": true, "description": "The secret to building powerful AI agents isn't magic - it's having a solid mental model around the different components to AI agents and how to create/integrate them effectively.\n\nIn this video I show you (with n8n so it's super visual) my \"7 Node Blueprint\" for designing AI agents effectively as interconnected graphs. ANY AI agent you build can be broken into components that fall into one of these categories, so it's worth understanding each of them:\n\n🧠 LLM Nodes: Reasoning and intelligence\n🛠️ Tool Nodes: External capabilities and data access\n⚙️ Control Nodes: Logic, routing, and business ru"}, {"title": "AI can't cross this line and we don't know why.", "video_id": "5eqRuVp65eY", "channel": "Welch Labs", "published_at": "2025-05-12T04:02:57Z", "topic": "AI Agents", "embeddable": true, "description": "Have we discovered an ideal gas law for AI? Head to https://brilliant.org/WelchLabs/ to try Brilliant for free for 30 days and get 20% off an annual premium subscription.\n\nWelch Labs Imaginary Numbers Book!\nhttps://www.welchlabs.com/resources/imaginary-numbers-book\n\nWelch Labs Posters: https://www.welchlabs.com/resources\n\nSupport Welch Labs on Patreon! https://www.patreon.com/welchlabs\nSpecial thanks to Patrons: Juan Benet, Ross Hanson, Yan Babitski, AJ Englehardt, Alvin Khaled, Eduardo Barraza, Hitoshi Yamauchi, Jaewon Jung, Mrgoodlight, Shinichi Hayashi, Sid Sarasvati, Dominic Beaumont, Shan"}, {"title": "Stanford CS25: V4 I Hyung Won Chung of OpenAI", "video_id": "orDKvo8h71o", "channel": "Stanford Online", "published_at": "2025-05-10T08:01:54Z", "topic": "AI Product Strategy", "embeddable": true, "description": "April 11, 2024\nSpeaker: Hyung Won Chung, OpenAI\n\nShaping the Future of AI from the History of Transformer \n\nAI is developing at such an overwhelming pace that it is hard to keep up. Instead of spending all our energy catching up with the latest development, I argue that we should study the change itself. First step is to identify and understand the driving force behind the change. For AI, it is the exponentially cheaper compute and associated scaling. I will provide a highly-opinionated view on the early history of Transformer architectures, focusing on what motivated each development and how "}, {"title": "Stanford CS25: V4 I Jason Wei & Hyung Won Chung of OpenAI", "video_id": "3gb-ZkVRemQ", "channel": "Stanford Online", "published_at": "2025-05-10T06:57:50Z", "topic": "Neural Language Models (NLMs)", "embeddable": true, "description": "April 11, 2024\nSpeakers: Jason Wei & Hyung Won Chung, OpenAI\n\nIntuitions on Language Models (Jason) \nJason will talk about some basic intuitions on language models, inspired by manual examination of data. First, he will discuss how one can view next word prediction as massive multi-task learning. Then, he will discuss how this framing reconciles scaling laws with emergent individual tasks. Finally, he will talk about the more general implications of these learnings. Slides here: https://docs.google.com/presentation/d/1JKpqsbkr5Fg-bj1iElPaC-ToTVpRmRLKZmN89krwl04/edit?usp=sharing&resourcekey=0-V"}, {"title": "Transformers are Universal Learning Machines", ord.gg/nPUm3ThuBc\n\nTitle: A Survey on Retrieval-Augmented Text Generation for Large Language Models\n\nAuthors: Yizheng Huang, Jimmy Huang\n\nAbstract:\nRetrieval-Augmented Generation (RAG) merges retrieval methods with deep\nlearning advancements to address the static limitations of large language\nmodels (LLMs) by enabling the dynamic integration of up-to-date external\ninformation. This methodology, focusing primarily on the text domain, provides\na cost-effective solution to the generation of plausible but possibly incorrect\nresponses by LLMs, t"}, {"title": "Retrieval Augmented Generation for LLMs  A Survey", "video_id": "DIz0oA_Z3jw", "channel": "GenAI Insight", "published_at": "2025-04-22T07:55:00Z", "topic": "Retrieval-Augmented Generation (RAG) & Vector Search", "embeddable": true, "description": "Summary\nThis survey paper examines Retrieval-Augmented Generation (RAG) for Large Language Models (LLMs). RAG enhances LLMs by incorporating external knowledge to improve accuracy and address issues like hallucinations and outdated information. The paper categorizes RAG approaches into three paradigms: Naive, Advanced, and Modular RAG, analyzing the core components of each—retrieval, generation, and augmentation—and highlighting state-of-the-art techniques. Furthermore, the paper provides a comprehensive overview of evaluation methods and benchmarks for RAG, concluding with a discussion of cur"}, {"title": "Model Context Protocol (MCP), Clearly Explained (Why it Matters)", "video_id": "e3MX7HoGXug", "channel": "Builders Central", "published_at": "2025-04-22T07:34:07Z", "topic": "Agent Frameworks & Orchestration (LangGraph/CrewAI/MCP)", "embeddable": true, "description": "In this video, we explain what MCP (Model Context Protocol) actually is, how this even became a thing, and the pain points it addresses. Also, we'll walk you through a live example of how to use MCP.\n\n\nCOMMENT below your thoughts on NO CODE & LOW CODE tools!\nLIKE, SHARE, SUBSCRIBE and don'
