le": "Private video", "video_id": "UZQ-2XIDcA8", "channel": "Arvind Devaraj", "published_at": "2025-04-21T13:48:00Z", "topic": "Self-Supervised & Contrastive Learning", "embeddable": false, "description": "This video is private."}, {"title": "Distillation Scaling Laws", "video_id": "Gl9mYGb6sjA", "channel": "Arjun Srivastava", "published_at": "2025-04-20T16:36:59Z", "topic": "Model Quantization & Compression", "embeddable": true, "description": "The paper focuses on creating smaller, more efficient language models through knowledge distillation. The research provides a 'distillation scaling law' that helps estimate student model performance based on teacher performance, student size, and distillation data amount.\n\nThe key takeaways for engineers/specialists include using the distillation scaling law for resource allocation decisions, understanding the importance of compute and data requirements, and resorting to supervised learning only when a well-designed plan for the teacher model is unavailable to avoid additional costs.\n\nRead ful"}, {"title": "Paper: DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning", "video_id": "XMnxKGVnEUc", "channel": "Umar Jamil", "published_at": "2025-04-20T16:36:43Z", "topic": "Research & Literature Review", "embeddable": true, "description": "Paper reading in the Discord group. All the lecture was improvised.\n\nJoin the group: https://discord.gg/JRKsaNbhCg\n\nLink to paper: https://github.com/deepseek-ai/DeepSeek-R1/blob/main/DeepSeek_R1.pdf"}, {"title": "AI Agent Mastery: Agent Architectures", "video_id": "kRZE7gRCPQA", "channel": "Arize AI", "published_at": "2025-04-20T16:34:03Z", "topic": "Agent Frameworks & Orchestration (LangGraph/CrewAI/MCP)", "embeddable": true, "description": "In this deep-dive session, we explore the essential building blocks of agent-based systems that drive efficient and scalable LLMs. Learn about key architectural models, including components, execution branches, and rou anguage Models, auto-regressively trained on the digital footprints of humanity, have shown impressive abilities in generating coherent text completions for a vast variety of prompts. While they excelled from the beginning in producing completions in appropriate style, factuality and reasoning/planning abilities remained their Achilles heel (premature claims notwithstanding). More recently a breed of approaches dubbed “reasoning models” (LRMs). These approaches leverage two broad and largely independent ideas: (i) test-time inference – which inv"}, {"title": "Optimizing vLLM Performance through Quantization | Ray Summit 2024", "video_id": "G1WNlLxPLSE", "channel": "Anyscale", "published_at": "2025-04-20T07:02:26Z", "topic": "Model Quantization & Compression", "embeddable": true, "description": "At Ray Summit 2024, Michael Goin and Robert Shaw from Neural Magic delve into the world of model quantization for vLLM deployments. Their presentation focuses on vLLM's support for various quantization methods, including FP8, INT8, and INT4, which are crucial for reducing memory usage and enhancing generation speed.\n\nIn the talk, Goin and Shaw explain the internal mechanisms of how vLLM leverages quantization to accelerate models. They also provide practical guidance on applying these quantization techniques to custom models using vLLM's llm-compressor framework. This talk offers valuable insi"}, {"title": "Deep Learning at Scale with Horovod feat. Travis Addair | Stanford MLSys Seminar Episode 10", "video_id": "DB7oOZ5hyrE", "channel": "Stanford MLSys Seminars", "published_at": "2025-04-20T06:59:12Z", "topic": "Deep Learning Frameworks (PyTorch/TensorFlow)", "embeddable": true, "description": "Episode 10 of the Stanford MLSys Seminar Series!\n\nHorovod and the Evolution of Deep Learning at Scale\nSpeaker: Travis Addair\n\nAbstract:\nDeep neural networks are pushing the state of the art in numerous machine learning research domains; from computer vision, to natural language processing, and even tabular business data.  However, scaling such models to train efficiently on large datasets imposes a unique set of challenges that traditional batch data processing systems were not designed to solve.  Horovod is an open source framework that scales models written in TensorFlow, PyTorch, and MXNet "}, {"title": "Dave Plummer explains Deepseek R1", "video_id": "r3TpcHebtxM", "channel": "Dave's Garage", "published_at": "2025-04-20T06:50:16Z", "topic": "LLM Reasoning & Test-Time Compute", "embeddable": true, "description": "Dave Plummer explains why Deepseek R1 is such a big deal, explains how it works, what's new, and brings you up to date on the implications and fall out!  Free Sample of my Book on the Spectrum: https://amzn.to/3zBinWM\n\nWatch ShopTalk Now on Dave's Attic: https://youtu.be/5Emgx0lhllE\n\nFollow me on X: https://x.com/davepl1968\nFacebook: https://www.facebook.com/davepl"}, {"title": "Master Autonomous AI Agents in Microsoft Copilot Studio - Easy to Build & Extremely Powerful", "video_id": "OZ_NgoFDiHI", "channel": "Collaboration Simplified", "published_at": "2025-04-20T05:57:43Z", "topic": "AI Agents", "embeddable": true, "description": "In this video, I’ll show you step-by-step how to create an Autonomous AI Agent that automatically finds answers in emails using internal company documents and prepares a detailed reply.  All that's left to do is click send! No coding required to build this agent.\n\nHere’s what you’ll learn:\n\n✅ What are Autonomous AI Agents?\n✅ How to build one from scratch in Copilot Studio\n✅ A real-world demo in action!\n\n► New to Copilot https://youtube.com/playlist?list=PLTIwUoNDer9c&si=WfK364DDj3TAvGNh\n► Ready to build your own agents https://youtube.com/playlist?list=PLVAQY2fRObVg&si=AbfPxQJvpLBbYx16\n► Want "}, {"title": "Stateful Agents — Full Workshop with Charles Packer of Letta and MemGPT", "video_id": "E0k9Ppq6yXY", "channel": "AI Engineer", "published_at": "2025-04-19T19:43:54Z", "topic": "AI Agents", "embeddable": true, "description": "A cornerstone of human intelligence is the ability to learn: as humans interact with the world, we form new memories and can adapt from experience. In this workshop, participants will learn about “stateful agents”: agents that live indefinitely, and can form new memories by learning from data and experience. The workshop will cover best practices for context and state management for agents, as well as how to avoid common challenges with agents (e.g. context overflow errors, memory loss, and lack of user personalization). \n\n\nIn this workshop you will:\n\n- Learn the principles behind context and "}, {"title": "Lec 24 | Alignment of Language Models-I", "video_id": "iAvWWIDaUEw", "channel": "NPTEL IIT Delhi", "published_at": "2025-04-19T17:31:50Z", "topic": "LLM Alignment & RLHF (DPO)", "embeddable": true, "description": "tl;dr: This lecture discusses aligning LLMs through reinforcement learning and reward modeling, focusing on RLHF and the balance between reward maximization and maintaining diversity to ensure human-aligned outputs.\n\n🎓 Lecturer: Tanmoy Chakraborty [https://tanmoychak.com]\n🔗 Get the Book: https://tanmoychak.com/llmbook\n📚 Suggested Readings:\n- Chapter-8, Intro to LLM, Section 8.4 (Alignment Methods) [https://tanmoychak.com/llmbook]\""}, {"title": "Lec 21 | Instruction Tuning", "video_id": "TPDiqPnJDTs", "channel": "NPTEL IIT Delhi", "published_at": "2025-04-19T16:17:00Z", "topic": "Prompt Engineering & In-Context Learning", "embeddable": true, "description": "tl;dr: This lecture discusses instruction tuning as a method to improve LLMs' ability to generalize to unseen tasks by fine-tuning them on natural language instructions, highlighting the FLAN framework and its impact on zero-shot learning. It also covers the Self-Instruct approach, which generates diverse instructions efficiently, further enhancing model performance on new tasks.\n\n🎓 Lecturer: Poulami Ghosh [https://www.linkedin.com/in/poulamig 👉 Build, showcase, and scale your skills with"}, {"title": "Architecting and Testing Controllable Agents: Lance Martin", "video_id": "ib-wTAvCZqg", "channel": "AI Engineer", "published_at": "2025-04-15T09:47:24Z", "topic": "Agent Frameworks & Orchestration (LangGraph/CrewAI/MCP)", "embeddable": true, "description": "LLM-powered autonomous agents combine (1) Tool calling, (2) Memory, and (3) Planning to autonomously perform tasks. While they hold tremendous promise, agent reliability has been a barrier for large-scale deployment and productionisation. We’ll cover ways to design and build reliable agents using LangGraph, which can support diverse self-corrective applications such as RAG and code generation. But, just as critically, we’ll cover ways to use LangSmith to test your agents, examining both agent's final response as well as agent tool use trajectories. Collectively, we’ll talk about three types of"}, {"title": "LangGraph Simplified: Master Custom AI Agent Creation", "video_id": "R-o_a6dvzQM", "channel": "Brainqub3", "published_at": "2025-04-15T07:19:21Z", "topic": "AI Agents", "embeddable": true, "description": "🔍 Try the AI Fact-Checker I built for this video:\nChatGPT Version: https://chatgpt.com/g/g-68fa9f99ed288191b5d9f8df6fe7616a-check-brainqub3\nWeb App: https://check.brainqub3.com/\nConsultancy queries: https://brainqub3.com/\n\nHere’s a LangGraph tutorial that should put your mind at ease. There is significant interest in the LangGraph framework due to its customisability and integrations. However, many have found the core concepts to be quite complex. This video breaks down those core concepts in a friendly and digestible manner and provides you with a Python tutorial for a custom web search agent"}, {"title": "The unspoken Truth About Autonomous Agents: Why LangGraph Will Dominate in 2024", "video_id": "VXHNke_u1lQ", "channel": "Eden Marco", "published_at": "2025-04-15T06:37:21Z", "topic": "AI Agents", "embeddable": true, "description": "🔍In this video, we will discuss:\n\nThe limitations of current autonomous agents like, AutoGPT, BabyAGI, GPT Engineer, and Devin the Engineer.\n\nWhy these projects, while innovative, are not yet suitable for production usage.\n\nThe philosophical reasons behind the failure of fully autonomous agents.\n\nHow LangGraph, the latest framework from @LangChain  is set to revolutionize the way we implement agents.\n\nThe concept of flow engineering and how it gives developers control while leveraging the power of LLMs.\n\n🌟 Why LangGraph?\nLangGraph offers an elegant solution for creating agentic architectures t"}, {"title": "Which Agentic AI Framework to Pick? LangGraph vs. CrewAI vs. AutoGen", "video_id": "8lsJ7zLa2Pk", "channel": "W.W. AI Adventures", "published_at": "2025-04-15T06:29:38Z", "topic": "AI Agents", "embeddable": true, "description": "Not sure which Agentic Framework to pick? Get an overview of 3 of the most popular. LangGraph, CrewAI and AutoGen. \n🎥 Channel: @WW_AI_Adventures\n\n# ============================\nChapters\n\n0:00 🕒 Intro\n01:36 AutoGen - How does it work? \n02:47 AutoGen – Learning Curve \n03:31 AutoGen – Integrations \n05:00 AutoGen – Scalability \n06:27AutoGen – Flexibility \n07:24 AutoGen – Documentation\n08:00 AutoGen – Other Features \n10:08 LangGraph - How does it work? \n10:56 LangGraph – Learning Curve \n11:41 LangGraph – Integrations \n12:20 LangGraph – Scalability \n13:20 LangGraph – Flexibility \n13:58 LangGraph – D"}, {"title": "Building Reliable Agents With LangGraph", "video_id": "q1gXyyLksA8", "channel": "Snowflake Developers", "published_at": "2025-04-15T06:04:31Z", "topic": "Agent Frameworks & Orchestration (LangGraph/CrewAI/MCP)", "embeddable": true, "description": "Autonomous agents powered by Large Language Models (LLMs) offer the potential to grant LLMs control over many kinds of tasks. However, ensuring reliability in these systems has been a significant hurdle. LangGraph is a low-level library designed to construct dependable agents. \n\nThis session from BUILD 2024 explores key features of LangGraph that enhance reliability, including robust memory management, seamless human-in-the-loop integration, and advanced control mechanisms. We delve into how these components work together to create more stable and trustworthy LLM-driven autonomous agents.\n\nTo "}, {"title": "Agentic AI - What and How!", "video_id": "UYJ539hgDS0", "channel": "John Savill's Technical Training", "published_at": "2025-04-14T16:56:32Z", "topic": "AI Agents", "embeddable": true, "description": "A look at what Agentic AI is and then how to create an agentic AI agent using Copilot Studio then Semantic Kernel.\n\n🔎 Looking for content on a particular topic? Search the channel. If I have something it will be there!\n🤔  Due to the channel growth and number of people wanting help I no longer can answer or even read questions and they will just stay in the moderation queue never to be seen so please post questions to other sites like Reddit, Microsoft Community Hub etc.\n\n▬▬▬▬▬▬  C H A P T E R S ⏰  ▬▬▬▬▬▬\n00:00 - Introduction\n00:26 - Types of AI agent\n05:27 - Agentic AI\n09:35 - Self-improving?\n"}, {"title": "crewAI Crash Course For Beginners-How To Create Multi AI Agent For Complex Usecases", "video_id": "UV81LAb3x2g", "channel": "Krish Naik", "published_at": "2025-04-14T14:32:43Z", "topic": "AI Agents", "embeddable": true, "description": "CrewAI tools empower agents with capabilities ranging from web searching and data analysis to collaboration and delegating tasks among coworkers. This documentation outlines how to create, integrate, and leverage these tools within the CrewAI framework, including a new focus on collaboration tools.\nCode Link: https://github.com/krishnaik06/Crew-AI-Crash-course\nVisit https://www.crewai.com/\n----------------------------------------------------------------------------------------\nSupport me by joining membership so that I can upload these kind of videos\nhttps://www.youtube.com/channel/UCNU_lfiiWB"}, {"title": "RAG Agents in Prod: 10 Lessons We Learned — Douwe Kiela, creator of RAG", "video_id": "kPL-6-9MVyA", "channel": "AI Engineer", "published_at": "2025-04-14T06:35:25Z", "topic": "AI Agents", "embeddable": true, "description": "The latest generation of LLMs is demonstrating impressive test time reasoning capabilities.  However, to be truly valuable in an enterprise setting requires those agentic capabilities to be applied to the right enterprise data. In all the excitement around AI agents, many of us have somehow forgotten the timeless adage “garbage in; garbage out” – language models can only do their job if they are contextualized properly. In this talk, Douwe Kiela will share lessons learned from deploying enterprise RAG systems at scale and how to design a system robust enough for the Fortune 500.\n\nRecorded live"}, {"title": "Intro to Reinforcement Learning Made Simple", "video_id": "1OI0uuz9jkI", "channel": "Edan Meyer", "published_at": "2025-04-14T06:33:18Z", "topic": "Reinforcement Learning", "embeddable": true, "description": "This video goes over an introduction to reinforcement learning theory. I go over what you can expect the series to cover, as well as get a start by going over Markov Decision Processes (MDPs)."}, {"title": "Building AI Agents from Scratch | Full Course", "video_id": "1OLrT3dEzhA", "channel": "The Neural Maze", "published_at": "2025-04-13T18:59:09Z", "topic": "AI Agents", "embeddable": true, "description": "Agents are everywhere these days, but with so much information available, it’s easy to feel overwhelmed. Most tutorials and videos focus on specific frameworks without covering the fundamental principles behind these systems.\n\nThis course takes a different approach. Over four modules, you'll learn to implement the four core agentic patterns from scratch, using just Python and Groq LLMs:\n\n* Reflection Pattern\n* Tool Use Pattern\n* Planning Pattern\n* Multi-Agent Pattern\n\nExplore the written lessons on my Substack blog:\n\nhttps://theneuralmaze.substack.com/\n\nCheck out the code here:\n\nhttps://github"}, {"title": "Why Use LangChain? A Blunt Overview for Advanced Engineers", "video_id": "iB-ZPOXzVv8", "channel": "IndyDevDan", "published_at": "2025-04-13T13:00:51Z", "topic": "LLM Reasoning & Test-Time Compute", "embeddable": true, "description": "Hey coders, in this video we explore LangChain, a comprehensive suite of tools designed for developing applications powered by advanced language models. In this unbiased review, we'll break down the key features, strengths, and weaknesses of LangChain to help you make an informed decision on whether it's the right choice for your projects. \n\nBy the end, you'll have a clear understanding of why LangChain may or may not be the ideal choice for your engineering needs. Subscribe for more in-depth AI tool deep dives, insights and evaluations.\n\n💻 If you're interested in the codebase let me know, I c"}, {"title": "Agent OS: LLM OS Micro Architecture for Composable, Reusable AI Agents", "video_id": "8wSH4XukcH8", "channel": "IndyDevDan", "published_at": "2025-04-13T13:00:34Z", "topic": "AI Agents", "embeddable": true, "description": "Agent OS is an architecture for building AI agents that focuses on IMMEDIATE results for today and over the long term.\n\nThe LLM Ecosystem is ever evolving so in order to keep up, you'll need an architecture that has interchangeable parts that can be swapped in and out as needed. This is where the Agent OS comes in.\n\nA great architecture, can future proof your AI agents and make them more adaptable.\n\nThe Agent OS is a micro architecture based off of Andrej Kaparthy's LLM OS. It's comprises three primary components: the Language Processing Unit (LPU), Input/Output (IO), and Random Access Memory "}, {"title": "Is human data enough? | David Silver", "video_id": "zzXyPGEtseI", "channel": "Google DeepMind", "published_at": "2025-04-12T19:33:17Z", "topic": "AI Product Strategy", "embeddable": true, "description": "In this episode of Google DeepMind: The Podcast, VP of Reinforcement Learning, David Silver, describes his vision for the future of AI, exploring the concept of the \"era of experience\" versus the current \"era of human data\". Using AlphaGo and AlphaZero as examples, he highlights how these systems surpassed human capabilities by engaging in reinforcement learning without prior human knowledge. This approach contrasts with large language models, which depend on human data and feedback. Silver emphasizes the need to explore this path to drive AI progress and achieve artificial  superintelligence."}, {"title": "Train Your Own LLM – Tutorial", "video_id": "9Ge0sMm65jo", "channel": "freeCodeCamp.org", "published_at": "2025-04-12T07:27:58Z", "topic": "Large Language Models (LLMs) & Pretraining", "embeddable": true, "description": "This course is designed to help beginners learn how to train a language model from start to finish. Imad will guide you through the whole process, using Moroccan Darija as an example.\n\nIn this course, you will learn:\n\n- How to load text data\n- How to train a tokenizer from scratch using the Byte Pair Encoding (BPE) method\n- How to use the tokenizer to encode text data\n- How the Transformer architecture works in language models\n- How to pre-train a model\n- How to create a supervised fine-tuning dataset\n- How to fine-tune the model and build an AI assistant that you can chat with\n\nYou can find t"}, {"title": "Ultimate RemNote Review: Best Student Note-Taking App?", "video_id": "5w4hCMcojl4", "channel": "Tool Finder", "published_at": "2025-04-10T17:37:56Z", "topic": "Research & Literature Review", "embeddable": true, "description": "Great software, for less, every week: https://dub.sh/tool-finder\n//\n// Stop doing busywork! Try Bento Focus: https://dub.sh/V8HyMzT Looking for the best student note-taking app? Check out this RemNote review and see if it's the right fit for your study needs! Get RemNote: https:// ning theory predicted that massively oversized models should overfit, and hence perform worse than smaller  models. Yet the undeniable fact is that modern LLMs do possess models of the world that allow them to generalize beyond their training data. \n\nWhy do larger models generalize better than smaller models? Why does training a model to predict internet text cause it to develop world models? Come deep dive into the inner working "}, {"title": "Deleted video", "video_id": "YK61MhwZ8Go", "channel": "Arvind Devaraj", "published_at": "2025-03-28T20:10:02Z", "topic": "Self-Supervised & Contrastive Learning", "embeddable": false, "description": "This video is unavailable."}, {"title": "TRPO (Trust Region Policy Optimization) : In depth  Research Paper Review", "video_id": "CKaN5PgkSBc", "channel": "Crazymuse", "published_at": "2025-03-28T18:59:36Z", "topic": "Reinforcement Learning", "embeddable": true, "description": "Trust Region Policy Optimization is a fundamental paper for people working in Deep Reinforcement Learning (along with PPO or Proximal Policy Optimization) . From training Mujoco to games, TRPO has been the goto choice. It is implemented by both Unity-ML as well as OpenAI Baselines.\n\nAt 2 minute 52 seconds, the equation on right is pi a|s and not pi s|a. (minor mistake.)\n\n Subscribe to our channel for more such videos. \n\nIn the comment section, do mention the research paper in Deep Learning or Deep RL which you want to see up next :) \n\n\nArxiv Link to the paper: https://arxiv.org/abs/1502.05477\n"}, {"title": "Introduction to Reinforcement Learning (non technical)", "video_id": "z-ktPPe_TZ4", "channel": "Matthew Berman", "published_at": "2025-03-28T07:21:40Z", "topic": "Reinforcement Learning", "embeddable": true, "description": "Join My Newsletter for Regular AI Updates 👇🏼\nhttps://forwardfuture.ai\n\nMy Links 🔗\n👉🏻 Subscribe: https://www.youtube.com/@matthew_berman\n👉🏻 Twitter: https://twitter.com/matthewberman\n👉🏻 Discord: https://discord.gg/xx s fortunate to be co-advised by"}, {"title": "Chain of Thought Prompting - Overview", "video_id": "uRNPnTxwvKQ", "channel": "Sherin Muckatira", "published_at": "2025-03-23T16:38:06Z", "topic": "LLM Reasoning & Test-Time Compute", "embeddable": true, "description": "Chain of Thought Prompting Elicits Reasoning in Large Language Models #nlp #prompts\nPaper link: https://arxiv.org/pdf/2201.11903.pdf"}, {"title": "Prefix-Tuning: Optimizing Continuous Prompts for Generation - Overview", "video_id": "gJlp6CuUN9U", "channel": "Sherin Muckatira", "published_at": "2025-03-23T16:37:09Z", "topic": "Prompt Engineering & In-Context Learning", "embeddable": true, "description": "Prefix-Tuning: Optimizing Continuous Prompts for Generation - Overview #nlp #prompts\nPaper link: https://arxiv.org/pdf/2101.00190.pdf"}, {"title": "Stanford CS330 I Variational Inference and Generative Models l 2022 I Lecture 11", "video_id": "iL1c1KmYPM0", "channel": "Stanford Online", "published_at": "2025-03-23T09:37:02Z", "topic": "Generative Models", "embeddable": false, "description": "For more information about Stanford's Artificial Intelligence programs visit: https://stanford.io/ai\n\nTo follow along with the course, visit: \nhttps://cs330.stanford.edu/\n\nTo view all online courses and programs offered by Stanford, visit: http://online.stanford.edu​\n\nChelsea Finn\nComputer Science, PhD\n\nPlan for Today\n1. Latent variable models\n2. Variational inference\n3. Amortized variational inference\n4. Example latent variables models\n\nGoals\n• Understand latent variable models in deep learning\n• Understand how to use (amortized) variational inference"}, {"title": "What Are Neural Networks Even Doing? (Manifold Hypothesis)", "video_id": "pdNYw6qwuNc", "channel": "Great Fate", "published_at": "2025-03-23T08:03:13Z", "topic": "Neural Network Foundations", "embeddable": true, "description": "In this video, I try to crack open the black box we call a #neuralnetwork 💪💪\n\nThe animations were made using #Manim Community Edition, and here is the code I wrote to generate them: \nhttps://github.com/igreat/videos/tree/main/manifold-hypothesis\n\nTimestamps:\n0:00 - recap\n0:49 - visualizing neural networks 2d\n3:05 - linear transformations\n3:27 - nonlinear transformations\n4:30 - affine transformations\n5:14 - back to 2d neural networks\n7:04 - why use more neurons per layer?\n10:10 - manifold hypothesis\n11:36 - visualizing handwritten digit separation\n12:56 - conclusion"}, {"title": "ML Research Paper Explained - A Reinforcement Learning Algorithm with no Burn in Cost", "video_id": "zvqV72ylvzU", "channel": "ML New Papers", "published_at": "2025-03-23T07:56:47Z", "topic": "Reinforcement Learning", "embeddable": true, "description": "Interested in Reinforcement Learning? Check out this interview of Amy Zhang, researcher in RL:\nhttps://youtu.be/NQ7chmF1MwI?si=UA_wYZt6r31v-snc\n\nWanna know more about bandits? Check out this video on a research paper on bandits:\nhttps://youtu.be/ciTe6ylC2mc?si=C2mVPQ5fl7OTs2LE\n\nIn this video, I present a research paper on RL which derived an algorithm with an optimal regret and no burn in cost!\n\nLink to the paper:\nhttps://arxiv.org/pdf/2307.13586\n\nCheck out my other videos: there are vlogs, researchers interviews, 10-minute research papers, tech career advice and more.\n\n#reinforcementlearning "}, {"title": "Rich Sutton, Toward a better Deep Learning", "video_id": "YLiXgPhb8cQ", "channel": "Amii", "published_at": "2025-03-23T07:39:01Z", "topic": "Deep Learning Architectures", "embeddable": true, "description": "Artificial intelligence needs better deep learning methods because current algorithms fail in continual learning settings, losing plasticity, forgetting catastrophically, and collapsing in their RL policies. I seek a design for a new class of deep learning methods that are dynamic (changing) at three levels: 1) in their weights, 2) in their per-weight step-size parameters, and 3) in their pattern of interconnection. The first step is distinguishing between the part of the network that is important to its current functioning (the backbone) from the part that does not yet contribute to its funct"}, {"title": "DeepSeek's GRPO (Group Relative Policy Optimization) | Reinforcement Learning for LLMs", "video_id": "xT4jxQUl0X8", "channel": "Julia Turc", "published_at": "2025-03-23T07:26:38Z", "topic": "Reinforcement Learning", "embeddable": true, "description": "In this video, I break down DeepSeek's Group Relative Policy Optimization (GRPO) from first principles, without assuming prior knowledge of Reinforcement Learning. By the end, you’ll understand the core RL building blocks that led to GRPO, including:\n\n🔵 Policy Gradient Methods\n🔵 The REINFORCE Algorithm\n🔵 Actor-Critic Models\n🔵 PPO (Proximal Policy Optimization)\n🔵 GRPO (Group-Relative policy Optimization)\n\nPapers:\nGRPO paper (DeepSeekMath): https://arxiv.org/pdf/2402.03300\nDeepSeek-R1 paper: https://arxiv.org/pdf/2501.12948\nPPO paper: https://arxiv.org/pdf/1707.06347\nGAE paper: https://arxiv.org"}, {"title": "How Machines Learn to Act", "video_id": "Dov68JsIC4g", "channel": "Art of the Problem", "published_at": "2025-03-23T07:25:26Z", "topic": "Reinforcement Learning", "embeddable": true, "description": "A full history of Reinforcement Learning's development, from Mitchie's matchbox computer to modern robotic systems. Traces the evolution of key concepts through games and physical control problems, showing how simulation-trained skills transfer to reality through domain randomization. Explores the emergence of human-like behaviors in AI agents and raises profound questions about the relationship between actions and language. Examines cutting-edge developments in embodied AI, from Tesla's Optimus (Figure, Atlas) to OpenAI's dexterous manipulation, and considers the future of action prediction m"}, {"title": "Easily Build Advanced Soft Prompt Engineering techniques, Prompt Tuning and Prefix Tuning", "video_id": "HkZOGGvZ dern models like Google's Gemini, Parti, and OpenAI's DallE generate images together with text. I tried to cover a lot of bases starting from the very basics (latent space, autoencoders), all the way to more complex topics (like VQ-VAEs, codebooks, etc). \n\nGive me a follow on Twitter for regular channel updates + daily ML/AI tutorials:  https://x.com/neural_avb\n\n\n#ai #deeplearning #machinelearning \n\nTo support the channel and access the Word documents/slides/animations used in this video"}, {"title": "From RLHF with PPO/DPO to ORPO + How to build ORPO on Trainium/Neuron SDK", "video_id": "6HO4gVW5F7E", "channel": "AI Performance Engineering", "published_at": "2025-03-21T18:27:33Z", "topic": "LLM Alignment & RLHF (DPO)", "embeddable": true, "description": "RSVP Webinar: https://www.eventbrite.com/e/webinar-generative-ai-on-aws-tickets-45852865154\n\nTalk #0: Introduction\nby Chris Fregly (Principal SA, Generative AI) and Antje Barth (Principal Developer Advocate, Generative AI)\n\nTalk #1: Human Alignment with Reinforcement Learning from Human Feedback (RLHF) with both PPO and DPO\nby Antje Barth (Principal Developer Advocate, Generative AI)\n\nProximal Policy Optimization (PPO): https://arxiv.org/pdf/1707.06347, 2017\nDirect Preference Optimization (DPO): https://arxiv.org/pdf/2305.18290, 2023\n\nTalk #2: From RLHF with PPO/DPO to ORPO + How to build ORPO"}, {"title": "Learning in deep neural networks", "video_id": "bL1Zymz1b7g", "channel": "MITCBMM", "published_at": "2025-03-21T07:15:32Z", "topic": "Deep Learning Frameworks (PyTorch/TensorFlow)", "embeddable": true, "description": "Taught by Phillip Isola\n\nExercises and references posted here: https://stellar.mit.edu/S/project/bcs-comp-tut/\n\nThanks to BCS seminar committee and postdoc committee (especially Evan Remington) for help with organizing and funding. Video editing by Avery Morris. Tutorial series founded by Emily Mackevicius."}, {"title": "Phillip Isola -- When and Why Does Contrastive Learing Work?", "video_id": "gtykKBUd8Hg", "channel": "Learning with Limited and Imperfect Data", "published_at": "2025-03-21T07:13:44Z", "topic": "Self-Supervised & Contrastive Learning", "embeddable": true, "description": ""}, {"title": "Deep Learning Day: Reasoning", "video_id": "s91WGN5-5A0", "channel": "MIT Schwarzman College of Computing", "published_at": "2025-03-21T05:58:01Z", "topic": "LLM Reasoning & Test-Time Compute", "embeddable": true, "description": "Philip Isola, Associate Professor in MIT's Department of Electrical Engineering and Computer Science and a member of the Computer Science and Artificial Intelligence Laboratory, discusses reasoning and search with deep nets.\n\nIsola's talk was part of Deep Learning Day for the MIT Schwarzman College of Computing's Expanding Horizons in Computing series. Organized by MIT faculty, the series comprised of four sessions that delved into key topics in computing — deep learning, societal impact, cryptography and security, and quantum technology. \n\nWatch more videos from the MIT Schwarzman College of "}, {"title": "Reinforcement Learning Explained with Maze-Solving Robot", "video_id": "vw0Zy_oCWxE", "channel": "Open Source", "published_at": "2025-03-20T07:13:44Z", "topic": "Reinforcement Learning", "embeddable": true, "description": "Dive into the fascinating world of Reinforcement Learning in this comprehensive guide! From the basics of machine learning types to advanced concepts like Q-Learning and Policy Gradients, we've got you covered. Watch as we break down complex ideas using a simple maze-solving robot example.\n\n🤖 Learn about:\n- Supervised vs Unsupervised vs Reinforcement Learning\n- Key components of RL: Agents, Environments, States, Actions, Rewards\n- The RL process and Markov Decision Processes\n- Exploration vs Exploitation dilemma\n- Deep Q-Learning and Policy Gradient methods\n\nWhether you're a beginner or an AI "}, {"title": "NVIDIA GTC May 2020 Keynote FULL", "video_id": "ix_rK8AdFiA", "channel": "OneBillionDollars", "published_at": "2025-03-18T09:32:38Z", "topic": "Hardware & Distributed Training", "embeddable": true, "description": ""}, {"title": "747: Technical Intro to Transformers and LLMs — with Kirill Eremenko", "video_id": "fMGPF2gpK4w", "channel": "Super Data Science: ML & AI Podcast with Jon Krohn", "published_at": "2025-03-18T03:22:05Z", "topic": "Transformers & Attention Mechanisms", "embeddable": true, "description": "#LLMs #TransformerArchitecture #AttentionMechanism \n\nhttp://www.superdatascience.com/llmcourse\nAttention and transformers in LLMs, the five stages of data processing, and a brand-new Large Language Models A-Z course: Kirill Eremenko joins host @JonKrohnLearns to explore what goes into well-crafted LLMs, what makes Transformers so powerful, and how to succeed as a data scientist in this new age of generative AI.\n\nThis episode is brought to you by Intel and HPE Ezmeral Software Solutions (https://bit.ly/hpeyt), and by Prophets of AI (https://prophetsofai.com), the leading agency for AI experts. "}, {"title": "Proximal Policy Optimization (PPO) for LLMs Explained Intuitively", "video_id": "8jtAzxUwDj0", "channel": "Julia Turc", "published_at": "2025-03-17T07:25:13Z", "topic": "Reinforcement Learning", "embeddable": true, "description": "In this video, I break down Proximal Policy Optimization (PPO) from first principles, without assuming prior knowledge of Reinforcement Learning. By the end, you’ll understand the core RL building blocks that led to PPO, including:\n🔵 Policy Gradient\n🔵 Actor-Critic Models\n🔵 The Value Function\n🔵 The Generalized Advantage Estimate\n\nIn the LLM world, PPO was used to train reasoning models like OpenAI's o1/o3, and presumably Claude 3.7, Grok 3, etc. It’s the backbone of Reinforcement Learning with Human Feedback (RLHF) -- which helps align AI models with human preferences and Reinforcement Learning"}, {"title": "Highlights of the Fireside Chat with Ilya Sutskever & Jensen Huang: AI Today & Vision of the Future", "video_id": "GI4Tpi48DlA", "channel": "Xiao Yang", "published_at": "2025-03-16T09:04:32Z", "topic": "AI Product Strategy", "embeddable": true, "description": "This is the condensed version of the \"Fireside Chat: With Ilya Sutskever and Jensen Huang: AI Today and Vision of the Future (March 2023)\". In this video, I've carefully selected the top 10 questions from the original hour-long talk and condensed them into just over 30 minutes. Additionally, I've created a timeline of these questions asked by Jensen to Ilya, accompanied by relevant research papers. As machine transcription is often inaccurate, I manually transcribed the entire video (laborious), recognizing the importance of accurate captions for those with hearing difficulties. Anyways, you m"}, {"title": "Eldar Kurtić - Beginner Friendly Introduction to LLM Quantization: From Zero to Hero", "video_id": "LK2-lrLvhTA", "channel": "Cohere", "published_at": "2025-03-16T04:46:38Z", "topic": "Model Quantization & Compression", "embeddable": true, "description": "Quantization is a powerful technique for accelerating large language model (LLM) inference, delivering significant gains in efficiency. Yet, for newcomers, the rapid evolution of methods and the complexity of the field can feel overwhelming. This tutorial is designed to demystify quantization and provide a solid foundation for beginners and practitioners alike.\nInstead of focusing on a single technique, we take a first-principles approach to understanding quantization. We begin with an accessible introduction to key concepts and the most widely used quantization formats. From there, we explore"}, {"title": "An Introduction to Markov Decision Processes and Reinforcement Learning", "video_id": "jpmZp3eX-wI", "channel": "Alborz Geramifard", "published_at": "2025-03-15T17:29:11Z", "topic": "Reinforcement Learning", "embeddable": true, "description": "RLPy: https://rlpy.readthedocs.io/en/latest/\nAI Gym: https://gym.openai.com/\nTutorial Paper:  A Tutorial on Linear Function Approximators for Dynamic Programming and Reinforcement Learning (http://alborz-geramifard.com/Files/13FTML-RLTutorial.pdf)"}, {"title": "The FASTEST introduction to Reinforcement Learning on the internet", "video_id": "VnpRp7ZglfA", "channel": "Gonkee", "published_at": "2025-03-15T16:00:58Z", "topic": "Reinforcement Learning", "embeddable": true, "description": "Reinforcement learning is a field of machine learning concerned with how an agent should most optimally take actions in an environment. I think this field of study will be very important in the next few decades, so here I am trying to make the knowledge more accessible.\n\nPatreon: https://www.patreon.com/Gonkee\n\nResources:\nReinforcement Learning: An Introduction (textbook) - http://incompleteideas.net/book/the-book-2nd.html\nOpenAI Spinning Up website - https://spinningup.openai.com/en/latest/index.html\nRL subreddit - https://www.reddit.com/r/reinforcementlearning/\n\nArticles:\nDeep Reinforcement "}, {"title": "AI Agents & the Future of Work with LangChain’s Harrison Chase | AI Basics with Google Cloud", "video_id": "_e6pgQ8yvqI", "channel": "This Week in Startups", "published_at": "2025-03-15T16:00:11Z", "topic": "AI Agents", "embeddable": true, "description": "In this episode: Jason sits down with Harrison Chase, CEO of LangChain, to explore how AI-powered agents are transforming the way startups operate. They discuss the shift from traditional entry-level roles to AI-driven automation, the importance of human-in-the-loop systems, and the future of AI-powered assistants in business. Harrison shares insights on how companies like Replit, Klarna, and GitLab are leveraging AI agents to streamline operations, plus a look ahead at what's next for AI-driven workflows. Brought to you in partnership with Google Cloud.\n\nTimestamps:\n(0:00) Introduction to Sta"}];
  const BY_ID = new Map(DATA.map(v => [v.video_id, v]));

  const playerWrap = document.getElementById("player-wrap");
  const titleEl = document.getElementById("now-playing-title");
  const metaEl = document.getElementById("now-playing-meta");
  const descEl = document.getElementById("now-playing-desc");
  const relatedListEl = document.getElementById("related-list");
  const relatedHeading = document.getElementById("related-heading");
  const searchEl = document.getElementById("search");
  const shuffleBtn = document.getElementById("shuffle-btn");

  const RELATED_LIMIT = 40;
  let query = "";

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function formatDate(iso) {
    return new Date(iso).toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  }

  function embedSrc(videoId) {
    const params = new URLSearchParams({ enablejsapi: "1", origin: window.location.origin });
    return `https://www.youtube.com/embed/${encodeURIComponent(videoId)}?${params.toString()}`;
  }

  function thumbUrl(videoId) {
    return `https://img.youtube.com/vi/${encodeURIComponent(videoId)}/hqdefault.jpg`;
  }

  function renderPlayer(video) {
    if (video.embeddable) {
      playerWrap.innerHTML = `
        <button class="video-facade" type="button" aria-label="Play ${escapeHtml(video.title)}">
          <img src="${thumbUrl(video.video_id)}" alt="" />
          <span class="play-badge">&#9654;</span>
        </button>`;
      playerWrap.querySelector(".video-facade").addEventListener("click", () => {
        playerWrap.innerHTML = `
          <iframe
            src="${embedSrc(video.video_id)}&autoplay=1"
            title="${escapeHtml(video.title)}"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>`;
      });
    } else {
      playerWrap.innerHTML = `
        <a class="watch-fallback" href="https://www.youtube.com/watch?v=${encodeURIComponent(video.video_id)}" target="_blank" rel="noopener noreferrer">
          <img src="${thumbUrl(video.video_id)}" alt="" />
          <div class="watch-fallback-overlay">&#9654; Watch on YouTube</div>
        </a>`;
    }
  }

  function renderNowPlaying(video) {
    renderPlayer(video);
    titleEl.textContent = video.title;
    metaEl.innerHTML = `
      <span class="topic-badge">${escapeHtml(video.topic)}</span>
      <span>${escapeHtml(video.channel || "")}</span>
      <span>${formatDate(video.published_at)}</span>`;
    descEl.textContent = video.description || "No description.";
  }

  function renderRelated(currentVideo) {
    const q = query.trim().toLowerCase();
    let pool;
    if (q) {
      relatedHeading.textContent = "Search results";
      pool = DATA.filter(v =>
        v.video_id !== currentVideo.video_id &&
        (v.title.toLowerCase().includes(q) || (v.channel || "").toLowerCase().includes(q))
      );
    } else {
      relatedHeading.textContent = `More in "${currentVideo.topic}"`;
      pool = DATA.filter(v => v.video_id !== currentVideo.video_id && v.topic === currentVideo.topic);
    }

    const items = pool.slice(0, RELATED_LIMIT);

    if (!items.length) {
      relatedListEl.innerHTML = `<div class="related-empty">Nothing else found.</div>`;
      return;
    }

    relatedListEl.innerHTML = items.map(v => `
      <button class="related-item" type="button" data-video-id="${escapeHtml(v.video_id)}" aria-current="false">
        <div class="related-thumb"><img src="${thumbUrl(v.video_id)}" alt="" loading="lazy" /></div>
        <div class="related-info">
          <div class="related-title">${escapeHtml(v.title)}</div>
          <div class="related-meta">${escapeHtml(v.channel || "")}</div>
        </div>
      </button>`
    ).join("");
  }

  function selectVideo(videoId, { pushHistory = true } = {}) {
    const video = BY_ID.get(videoId);
    if (!video) return;

    renderNowPlaying(video);
    renderRelated(video);

    if (pushHistory) {
      const url = new URL(window.location.href);
      url.searchParams.set("v", videoId);
      history.pushState({ videoId }, "", url);
    }
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  relatedListEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".related-item");
    if (!btn) return;
    selectVideo(btn.dataset.videoId);
  });

  searchEl.addEventListener("input", () => {
    query = searchEl.value;
    const current = BY_ID.get(new URL(window.location.href).searchParams.get("v")) || DATA[0];
    renderRelated(current);
  });

  shuffleBtn.addEventListener("click", () => {
    const random = DATA[Math.floor(Math.random() * DATA.length)];
    selectVideo(random.video_id);
  });

  window.addEventListener("popstate", () => {
    const id = new URL(window.location.href).searchParams.get("v");
    if (id && BY_ID.has(id)) selectVideo(id, { pushHistory: false });
  });

  const initialId = new URL(window.location.href).searchParams.get("v");
  const initialVideo = (initialId && BY_ID.get(initialId)) || DATA[Math.floor(Math.random() * DATA.length)];
  selectVideo(initialVideo.video_id, { pushHistory: true });
</script>
